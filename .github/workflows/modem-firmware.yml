name: Signed modem firmware caller

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-modem-firmware
  cancel-in-progress: false

jobs:
  verify-stock-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install firmware and native compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            p7zip-full python3 python3-cryptography libssl-dev libfdt-dev build-essential git
      - name: Fetch exact kernel ASN.1 and existing loader sources
        run: |
          git init upstream/linux
          git -C upstream/linux remote add origin https://github.com/MT6878-mainline/linux.git
          git -C upstream/linux sparse-checkout init --no-cone
          git -C upstream/linux sparse-checkout set \
            /include/linux/asn1.h /include/linux/asn1_decoder.h \
            /include/linux/asn1_ber_bytecode.h /scripts/asn1_compiler.c /lib/asn1_decoder.c
          git -C upstream/linux fetch --filter=blob:none --depth=1 origin \
            d84b264a54a37611f2f46bc19363cb9b41606205
          git -C upstream/linux checkout --detach FETCH_HEAD
          git init upstream/u-boot
          git -C upstream/u-boot remote add origin https://github.com/xxxvik-xakerxxx/u-boot.git
          git -C upstream/u-boot sparse-checkout init --no-cone
          git -C upstream/u-boot sparse-checkout set \
            /board/mediatek/mt6878/tetris_modem_layout.c \
            /board/mediatek/mt6878/tetris_modem_layout.h \
            /board/mediatek/mt6878/tetris_modem_bundle.h
          git -C upstream/u-boot fetch --filter=blob:none --depth=1 origin \
            bffec9306e7c40a432d79deefb450230c2ee2360
          git -C upstream/u-boot checkout --detach FETCH_HEAD
      - name: Extract only the public stock modem firmware
        run: python3 ci/extract-stock-modem.py
      - name: Verify actual manufacturer-signed input and optimized placement
        run: |
          python3 patches/modem/drafts/signed-input/check_stock_input.py \
            --native-ci --kernel upstream/linux --uboot upstream/u-boot \
            --stock-container out/stock-modem/md1img.bin
      - name: Verify finite modem power and BROM transaction with fault injection
        run: |
          python3 patches/modem/drafts/boot-stage/check_bootstrap.py \
            --native-ci --uboot upstream/u-boot
      - name: Verify stock-derived EMI rows and preset transaction
        run: |
          python3 patches/modem/drafts/emi-rows/check_emi_rows.py \
            --native-ci --uboot upstream/u-boot \
            --stock-container out/stock-modem/md1img.bin
      - name: Verify integrated typed bootstrap and allocation owner
        run: |
          python3 patches/modem/drafts/bootstrap-integration/check_bootstrap.py \
            --native-ci --uboot upstream/u-boot \
            --stock-container out/stock-modem/md1img.bin
          python3 patches/modem/drafts/bootstrap-integration/check_loaded_boot.py \
            --native-ci --uboot upstream/u-boot
      - name: Verify authenticated snapshot lifetime and real CCCI tag ABI
        run: |
          python3 patches/modem/drafts/boot-producers/check_storage_lifetime.py \
            --native-ci --uboot upstream/u-boot
          python3 patches/modem/drafts/boot-producers/check_ccci_tags.py \
            --native-ci --uboot upstream/u-boot \
            --stock-container out/stock-modem/md1img.bin
      - name: Fetch integrated owned modem boot producers
        run: |
          git -C upstream/u-boot fetch --depth=1 origin \
            24e7c183c4e5fa279f2bc7c3d3ac60683f999157 \
            94ead1146c93fef603db5c85820f2fb04c559c10
          git -C upstream/u-boot sparse-checkout disable
          git -C upstream/u-boot checkout --detach FETCH_HEAD
      - name: Verify exact integrated lifetime and final-DT transaction
        run: |
          (cd patches/modem/drafts/startup-final && sha256sum --check --strict REVIEW.sha256)
          (cd patches/modem/drafts/ufs-producer-faults && sha256sum --check --strict REVIEW.sha256)
          python3 patches/modem/drafts/ufs-producer-faults/test_checker_modes.py upstream/u-boot
          python3 patches/modem/drafts/startup-final/check_startup_final.py \
            --native-ci --uboot upstream/u-boot
          python3 patches/modem/drafts/ufs-producer-faults/check_producer_faults.py \
            --native-ci --owned-loader-ci --uboot upstream/u-boot
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('out/stock-modem/BUILD-MANIFEST.json') != '' }}
        with:
          name: tetris-stock-modem-caller-manifest
          path: out/stock-modem/BUILD-MANIFEST.json
          if-no-files-found: error
          retention-days: 7
