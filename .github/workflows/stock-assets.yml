name: Stock port assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-port-assets
  cancel-in-progress: false

jobs:
  extract-selected-vendor-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install read-only image extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            p7zip-full e2fsprogs erofs-utils android-sdk-libsparse-utils python3
      - name: Extract pinned generic B4.1 vendor assets
        run: python3 ci/extract-stock-port-assets.py
      - uses: actions/upload-artifact@v7
        with:
          name: tetris-b41-selected-stock-port-assets
          path: out/stock-port-assets/
          retention-days: 1
          if-no-files-found: error
