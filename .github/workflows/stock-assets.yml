name: Stock port assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-port-assets
  cancel-in-progress: false

jobs:
  extract-selected-vendor-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install read-only image extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            p7zip-full e2fsprogs erofs-utils android-sdk-libsparse-utils \
            python3 python3-pyelftools python3-unicorn python3-cryptography \
            build-essential pkg-config libxml2-dev libssl-dev git
      - name: Extract pinned generic B4.1 vendor assets
        run: python3 ci/extract-stock-port-assets.py
      - name: Verify owned GPUEB SRAM and quarantined partial startup
        if: ${{ !cancelled() }}
        env:
          TETRIS_DEVICE_MODULES_TREE: ${{ github.workspace }}/upstream/device-modules
        run: |
          mkdir -p upstream/device-modules
          git -C upstream/device-modules init
          git -C upstream/device-modules remote add origin \
            https://github.com/NothingOSS/android_kernel_device_modules_6.1_nothing_mt6878.git
          git -C upstream/device-modules sparse-checkout init --no-cone
          git -C upstream/device-modules sparse-checkout set \
            /arch/arm64/boot/dts/mediatek/mt6878.dts \
            /drivers/soc/mediatek/mtk-dvfsrc.c \
            /drivers/misc/mediatek/eccci/Kconfig
          git -C upstream/device-modules fetch --filter=blob:none --depth=1 origin \
            ee2be53cb75670b548948636a0db1d1ff112bf12
          git -C upstream/device-modules checkout --detach FETCH_HEAD
          sh patches/gpu/run_gpueb_sram_owner_ci.sh
      - name: Verify immutable modem reservation owner
        if: ${{ !cancelled() }}
        run: python3 patches/modem/check_handoff_reservation.py --native-ci
      - name: Fetch pinned kernel caller sources
        if: ${{ !cancelled() }}
        run: |
          mkdir -p upstream/linux
          git -C upstream/linux init
          git -C upstream/linux remote add origin https://github.com/MT6878-mainline/linux.git
          git -C upstream/linux sparse-checkout init --no-cone
          git -C upstream/linux sparse-checkout set \
            /drivers/gpu/drm/panthor/ /drivers/mailbox/mtk-gpueb-mailbox.c \
            /include/linux/dma-buf.h /include/linux/asn1.h \
            /include/linux/asn1_decoder.h /include/linux/asn1_ber_bytecode.h \
            /scripts/asn1_compiler.c /lib/asn1_decoder.c
          git -C upstream/linux fetch --filter=blob:none --depth=1 origin \
            d84b264a54a37611f2f46bc19363cb9b41606205
          git -C upstream/linux checkout --detach FETCH_HEAD
      - name: Verify GPUEB parent adoption and real caller migration
        if: ${{ !cancelled() }}
        env:
          TETRIS_KERNEL_TREE: ${{ github.workspace }}/upstream/linux
          TETRIS_DEVICE_MODULES_TREE: ${{ github.workspace }}/upstream/device-modules
        run: sh patches/gpu/run_gpueb_sram_adoption_ci.sh
      - name: Verify modem raw RSA and strict PSS32 error handling
        if: ${{ !cancelled() }}
        run: python3 patches/modem/check_pss32_backend.py --native-ci
      - name: Verify pinned MTK certificate delegation with real ASN.1 decoder
        if: ${{ !cancelled() }}
        run: |
          python3 patches/modem/check_mtk_cert.py --native-ci --kernel upstream/linux
          python3 patches/modem/test_signed_ram_ci.py
      - name: Verify bounded GPUEB MMIO transaction and quarantine logic
        if: ${{ !cancelled() }}
        env:
          TETRIS_DEVICE_MODULES_TREE: ${{ github.workspace }}/upstream/device-modules
        run: sh patches/gpu/run_gpueb_mmio_scope_ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: tetris-b41-selected-stock-port-assets
          path: out/stock-port-assets/
          retention-days: 1
          if-no-files-found: error
      - name: Verify GPS XML with native fault fixtures
        run: |
          sh patches/gnss-navigation-audit/run_xml_config_ci.sh \
            out/stock-port-assets/vendor/etc/MNL_Config.xml
      - name: Verify GPS runtime producer instructions
        if: ${{ !cancelled() }}
        run: |
          python3 patches/gnss-navigation-audit/test_b41_machine_lifetime.py \
            out/stock-port-assets/vendor/lib64/mt6878/libmnl.so
          python3 patches/gnss-navigation-audit/test_b41_runtime_producers.py \
            out/stock-port-assets/vendor/bin/mnld \
            out/stock-port-assets/vendor/lib64/mt6878/libmnl.so \
            out/stock-port-assets/vendor/etc/MNL_Config.xml
          python3 patches/gnss-navigation-audit/test_b41_bundle_producers.py \
            out/stock-port-assets/vendor/bin/mnld
      - name: Verify GPS runtime constructors and bounded host worker
        if: ${{ !cancelled() }}
        run: |
          sh patches/gnss-navigation-audit/run_runtime_integration_ci.sh \
            out/stock-port-assets/vendor/etc/MNL_Config.xml
      - name: Verify actual GPS registration layout and retained argument copies
        if: ${{ !cancelled() }}
        run: |
          python3 patches/gnss-navigation-audit/test_b41_engine_registration_shape.py \
            out/stock-port-assets/vendor/lib64/mt6878/libmnl.so
          python3 patches/gnss-navigation-audit/test_b41_engine_config_copy.py \
            out/stock-port-assets/vendor/lib64/mt6878/libmnl.so
          sh patches/gnss-navigation-audit/run_engine_arguments_ci.sh
      - name: Verify scoped modem startup and immutable handoff boundaries
        if: ${{ !cancelled() }}
        run: python3 patches/modem/check_startup_scope.py --native-ci --vendor upstream/device-modules
      - name: Verify matching camera command encoding
        if: ${{ !cancelled() }}
        run: |
          mkdir -p upstream/connectivity-modules
          git -C upstream/connectivity-modules init
          git -C upstream/connectivity-modules remote add origin \
            https://github.com/NothingOSS/android_kernel_modules_nothing_mt6878.git
          git -C upstream/connectivity-modules fetch --depth=1 origin \
            e96f60dc081ae3525ef43d4bcf0ee5ee97e53835
          git -C upstream/connectivity-modules checkout --detach FETCH_HEAD
          python3 patches/camera-ccd-cq/check.py out/stock-port-assets \
            --modules-repo upstream/connectivity-modules
          sh patches/camera-ccd-cq/run-tests.sh
      - name: Verify camera frame recipe and real CCD ioctl caller
        if: ${{ !cancelled() }}
        run: |
          python3 patches/camera-ccd-cq/check-recipe.py out/stock-port-assets \
            --modules-repo upstream/connectivity-modules
          sh patches/camera-ccd-cq/run-recipe-tests.sh
      - name: Verify concrete camera DMA and CCD ownership sources
        if: ${{ !cancelled() }}
        run: |
          python3 patches/camera-pipeline-owner/check.py \
            --modules-repo upstream/connectivity-modules \
            --device-repo upstream/device-modules \
            --kernel-tree upstream/linux --assets out/stock-port-assets
      - name: Verify matching GPU CSF format
        if: ${{ !cancelled() }}
        run: |
          python3 patches/gpu/csf_preflight.py \
            out/stock-port-assets/vendor/firmware/mali_csffw.bin --kernel-tree upstream/linux
          python3 patches/gpu/test_csf_preflight.py
