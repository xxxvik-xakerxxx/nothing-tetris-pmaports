name: GNSS XML and ADC native backends

on:
  workflow_dispatch:
    inputs:
      lna_only:
        description: Run only the native LNA startup dataflow, without unchanged XML oracles
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: gnss-xml-adc-native
  cancel-in-progress: false

jobs:
  lna-start-dataflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install native and static decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang pkg-config libxml2-dev libssl-dev python3 python3-pip git
          python3 -m pip install --target out/lna-python capstone==5.0.6
      - uses: actions/download-artifact@v7
        with:
          name: tetris-b41-selected-stock-port-assets
          run-id: 38048111345
          github-token: ${{ github.token }}
          path: out/lna-stock
      - name: Fetch exact stock ioctl source
        run: |
          git init out/lna-kernel-source
          git -C out/lna-kernel-source fetch --depth=1 --filter=blob:none \
            https://github.com/NothingOSS/android_kernel_modules_nothing_mt6878.git \
            e96f60dc081ae3525ef43d4bcf0ee5ee97e53835
          test "$(git -C out/lna-kernel-source rev-parse FETCH_HEAD)" = e96f60dc081ae3525ef43d4bcf0ee5ee97e53835
          source=connectivity/gps/gps_mcudl/linux/gps_mcudl_each_device.c
          mkdir -p "out/lna-kernel-source/$(dirname "$source")"
          git -C out/lna-kernel-source show "FETCH_HEAD:$source" > "out/lna-kernel-source/$source"
      - name: Verify producer and consumer, then execute native dataflow
        id: lna
        env:
          CC: clang
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/out/lna-python"
          export TETRIS_MODULES_TREE="$PWD/out/lna-kernel-source"
          mkdir -p out/lna-start-evidence
          draft=patches/gnss-navigation-audit/lna-start-contract
          vendor=$PWD/out/lna-stock/vendor
          python3 -B "$draft/test_static.py" "$vendor/bin/mnld" "$vendor/lib64/mt6878/libmnl.so" \
            2>&1 | tee out/lna-start-evidence/static.log
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            sh "$draft/run_ci.sh" "$vendor/etc/MNL_Config.xml" \
            2>&1 | tee out/lna-start-evidence/native.log
          sha256sum "$draft"/* > out/lna-start-evidence/SOURCE-SHA256SUMS
      - name: Preserve actual result
        if: always()
        run: |
          mkdir -p out/lna-start-evidence
          printf '%s\n' \
            '{"commit":"${{ github.sha }}","outcome":"${{ steps.lna.outcome }}","vendor_init_called":false,"hardware_readiness":false}' \
            > out/lna-start-evidence/RESULT.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnss-lna-start-dataflow
          path: out/lna-start-evidence/
          if-no-files-found: error

  native-backends:
    if: ${{ !inputs.lna_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install actual native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang pkg-config libxml2-dev \
            libssl-dev python3 python3-pyelftools python3-unicorn
      - name: Obtain pinned public stock inputs
        uses: actions/download-artifact@v7
        with:
          name: tetris-b41-selected-stock-port-assets
          run-id: 38048111345
          github-token: ${{ github.token }}
          path: out/selected-stock
      - name: Check runner admission
        run: python3 patches/gnss-navigation-audit/test_b41_xml_adc_runner.py
      - name: Execute XML, ADC and actual policy fixtures
        id: execute
        env:
          CC: clang
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          sh patches/gnss-navigation-audit/run_xml_adc_ci.sh native \
            "$PWD/out/selected-stock/vendor/lib64/mt6878/libmnl.so" \
            "$PWD/out/selected-stock/vendor/etc/MNL_Config.xml" \
            "$PWD/out/selected-stock/vendor/bin/mnld" \
            "$PWD/out/xml-adc-native"
          audit=patches/gnss-navigation-audit
          draft=$audit/xml-policy-draft
          vendor=$PWD/out/selected-stock/vendor
          mkdir out/xml-adc-native/policy
          sha256sum "$draft"/*.py "$draft"/*.c "$draft"/*.h "$draft"/*.sh \
            "$audit/b41_xml_config.h" "$audit/test_b41_startup.py" \
            "$audit/test_b41_xml_producer.py" \
            > out/xml-adc-native/policy/SOURCE-SHA256SUMS
          python3 "$draft/test_xml_policy_evidence.py" \
            "$vendor/lib64/mt6878/libmnl.so" "$vendor/etc/MNL_Config.xml" \
            2>&1 | tee out/xml-adc-native/policy/evidence.log
          python3 "$draft/test_b41_xml_read_profile.py" \
            "$vendor/lib64/mt6878/libmnl.so" "$vendor/bin/mnld" \
            "$vendor/etc/MNL_Config.xml" \
            2>&1 | tee out/xml-adc-native/policy/profile-tests.log
          python3 "$draft/b41_xml_read_profile.py" \
            "$vendor/lib64/mt6878/libmnl.so" "$vendor/bin/mnld" \
            "$vendor/etc/MNL_Config.xml" \
            > out/xml-adc-native/policy/READ-PROFILE.json
          sh "$draft/run_xml_set_tail_ci.sh" "$PWD/out/xml-adc-native/policy/native" \
            2>&1 | tee out/xml-adc-native/policy/native.log
          timeout --signal=TERM --kill-after=2 120 \
            python3 "$draft/test_b41_xml_set_tail_oracle.py" \
            "$vendor/lib64/mt6878/libmnl.so" "$vendor/etc/MNL_Config.xml" \
            "$PWD/out/xml-adc-native/policy/native/test_xml_set_tail" \
            2>&1 | tee out/xml-adc-native/policy/set-oracle.log
          timeout --signal=TERM --kill-after=2 120 \
            python3 "$draft/test_b41_xml_read_profile_oracle.py" \
            "$vendor/lib64/mt6878/libmnl.so" "$vendor/bin/mnld" \
            "$vendor/etc/MNL_Config.xml" \
            2>&1 | tee out/xml-adc-native/policy/read-oracle.log
      - name: Record scope and actual step outcome
        if: always()
        run: |
          mkdir -p out/xml-adc-native
          printf '%s\n' \
            '{"commit":"${{ github.sha }}","step_outcome":"${{ steps.execute.outcome }}","mode":"native-asan-ubsan","bionic_build":false,"vendor_init_called":false,"hardware_readiness":false}' \
            > out/xml-adc-native/RESULT.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnss-xml-adc-native-evidence
          path: out/xml-adc-native/
          if-no-files-found: error
