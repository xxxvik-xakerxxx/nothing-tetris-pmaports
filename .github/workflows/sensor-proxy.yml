name: Sensor proxy live candidate
on:
  push:
    paths:
      - 'integrations/sensor-proxy/**'
      - '.github/workflows/sensor-proxy.yml'
  pull_request:
    paths:
      - 'integrations/sensor-proxy/**'
      - '.github/workflows/sensor-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensor-proxy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Build and test standard proxy with HF backend
        run: |
          docker run --rm -e GITHUB_SHA -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP:/out" -w /src alpine:edge sh -ec '
              apk add --no-cache abuild build-base linux-headers curl patch meson glib-dev libgudev-dev polkit-dev libssc-dev coreutils
              sh integrations/sensor-proxy/build-ci.sh /out/sensor-proxy-build
            '
      - uses: actions/upload-artifact@v7
        with:
          name: sensor-proxy-aarch64
          path: ${{ runner.temp }}/sensor-proxy-build/artifact/
          if-no-files-found: error
