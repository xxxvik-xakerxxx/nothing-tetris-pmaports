name: GNSS sealed ARM64 load

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gnss-sealed-arm64-load
  cancel-in-progress: false

jobs:
  load-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential python3 python3-pyelftools
      - name: Obtain verified selected stock providers
        uses: actions/download-artifact@v7
        with:
          name: tetris-b41-selected-stock-port-assets
          run-id: 38048111345
          github-token: ${{ github.token }}
          path: out/selected-stock
      - name: Obtain independent original load-only probe
        uses: actions/download-artifact@v7
        with:
          name: gnss-load-only-probe
          run-id: 37898372984
          github-token: ${{ github.token }}
          path: out/original-probe
      - name: Verify offline admission and prepare independent probe
        run: |
          python3 ci/test-gnss-delegated-load.py
          python3 patches/gnss-navigation-audit/test_b41_sealed_probe_cli.py
          python3 patches/gnss-navigation-audit/test_b41_sealed_probe_ci.py
          mkdir out/probe
          install -m555 out/original-probe/mnl-load-probe out/probe/probe
          printf '%s  %s\n' \
            011a0dd90ab2043fd2eb8312024f000769d093b8e1b58e0e3540509122e7c214 \
            out/probe/probe | sha256sum --check
      - name: Execute actual control then sealed Bionic load
        id: execute
        run: |
          unit="tetris-sealed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo -n systemd-run --unit="$unit" --wait --pipe \
            --property=Delegate=memory --property=MemoryMax=256M \
            --property=MemorySwapMax=0 --property=RuntimeMaxSec=90s \
            --property=KillMode=control-group \
            --setenv=CI=true --setenv=PYTHONDONTWRITEBYTECODE=1 \
            --setenv="TETRIS_UNIT=$unit.service" \
            --setenv="TETRIS_B41_SELECTED_STOCK=$PWD/out/selected-stock" \
            --setenv="TETRIS_B41_PROBE_ARTIFACT=$PWD/out/probe" \
            --setenv=TETRIS_MNL_LAYOUT=vendor/lib64/mt6878/libmnl.so \
            /usr/bin/python3 "$PWD/ci/gnss-delegated-load.py" \
            "$PWD/patches/gnss-navigation-audit/run_sealed_probe_parent_ci.sh"
      - name: Retain actual results and containment diagnostics
        if: always()
        run: |
          mkdir -p out/sealed-load-evidence
          sudo find /run -maxdepth 1 -type d -name 'b41-sealed-cli-ci-*' \
            -exec cp -a '{}' out/sealed-load-evidence/ \;
          sudo chown -R "$(id -u):$(id -g)" out/sealed-load-evidence
          systemctl status "tetris-sealed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-pager > out/sealed-load-evidence/unit-status.txt || true
          printf 'commit=%s\nstock_run=38048111345\nprobe_run=37898372984\nmode=load-only-no-init\n' \
            "$GITHUB_SHA" > out/sealed-load-evidence/BUILD-MANIFEST
          printf '%s\n' \
            '{"policy":"destructive-ci-only-service-containment","step_outcome":"${{ steps.execute.outcome }}","runtime_use_allowed":false,"forced_cleanup_is_terminal_reap":false,"quarantine_survives_service_exit":false}' \
            > out/sealed-load-evidence/OUTER-CONTAINMENT.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnss-sealed-arm64-load-evidence
          path: out/sealed-load-evidence/
          if-no-files-found: error
