name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PMBOOTSTRAP_COMMIT: ea17c1499b7f82d5829849314e89b23684919141
  PMAPORTS_COMMIT: 7ea600ada6d4716b500bda0d6a17ba396be05b5c
  TETRIS_UBOOT_COMMIT: b76e47e774304ab550a6354f3286860b7caffb3a
  TETRIS_UBOOT_SHA256: 869303227941e0f050d083c74eeffcfb9bf90bf80a59978780b915d22722b9c4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    container: alpine:3.23.3
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: apk add --no-cache coreutils findutils git shellcheck
      - name: Shellcheck
        run: shellcheck -S error scripts/*.sh
      - name: Validate pmaports overlay
        run: ./scripts/validate-pmaports-overlay.sh
      - name: Validate kernel package layout
        run: |
          kernel_apkbuild=pmaports/device/testing/linux-postmarketos-mediatek-mt6878/APKBUILD
          device_apkbuild=pmaports/device/testing/device-nothing-tetris/APKBUILD
          if grep -q '^subpackages=' "$kernel_apkbuild"; then
            echo "kernel package must not split hardware modules into subpackages"
            exit 1
          fi
          if grep -q 'linux-postmarketos-mediatek-mt6878-\(pmic\|connectivity\|audio\)' \
              "$device_apkbuild"; then
            echo "device package must not depend on split kernel hardware packages"
            exit 1
          fi
          if sed -n '/uses: actions\/cache\/\(restore\|save\)@/,/key:/p' \
              .github/workflows/ci.yml | grep -q '/pmwork/work/packages'; then
            echo "package output must not be restored from the Actions cache"
            exit 1
          fi

  build-pmaports:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    container:
      image: alpine:3.23.3
      options: --privileged --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - name: Prepare /work checkout
        run: |
          mkdir -p /work
          cp -a "$GITHUB_WORKSPACE"/. /work/
      - name: Install build tools
        run: |
          apk add --no-cache \
            android-tools \
            build-base bzip2 ccache coreutils cryptsetup dosfstools e2fsprogs-extra \
            dtc file findutils git kmod linux-headers mtools multipath-tools openssl \
            openssl-dev parted patch py3-yaml python3 rsync sfdisk sudo tar \
            util-linux xz zstd
      - name: Fetch upstream pmaports and pmbootstrap
        run: |
          cd /work
          mkdir -p upstream/pmbootstrap upstream/pmaports
          git -C upstream/pmbootstrap init
          git -C upstream/pmbootstrap remote add origin \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          git -C upstream/pmbootstrap fetch --depth=1 origin "$PMBOOTSTRAP_COMMIT"
          git -C upstream/pmbootstrap checkout --detach FETCH_HEAD
          test "$(git -C upstream/pmbootstrap rev-parse HEAD)" = "$PMBOOTSTRAP_COMMIT"
          git -C upstream/pmaports init
          git -C upstream/pmaports remote add origin \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C upstream/pmaports fetch --depth=1 origin "$PMAPORTS_COMMIT"
          git -C upstream/pmaports checkout --detach FETCH_HEAD
          test "$(git -C upstream/pmaports rev-parse HEAD)" = "$PMAPORTS_COMMIT"
          git -C upstream/pmaports update-ref \
            refs/remotes/origin/main "$PMAPORTS_COMMIT"
          rm -rf \
            upstream/pmaports/device/testing/device-nothing-tetris \
            upstream/pmaports/device/testing/firmware-nothing-tetris \
            upstream/pmaports/device/testing/linux-postmarketos-mediatek-mt6878
          rsync -a \
            pmaports/device/testing/device-nothing-tetris/ \
            upstream/pmaports/device/testing/device-nothing-tetris/
          rsync -a \
            pmaports/device/testing/firmware-nothing-tetris/ \
            upstream/pmaports/device/testing/firmware-nothing-tetris/
          rsync -a \
            pmaports/device/testing/linux-postmarketos-mediatek-mt6878/ \
            upstream/pmaports/device/testing/linux-postmarketos-mediatek-mt6878/
      - name: Prepare pmbootstrap workdir
        run: |
          mkdir -p /pmwork/work/cache_distfiles
          mkdir -p /pmwork/work/cache_ccache_x86_64
          mkdir -p /pmwork/work/cache_sccache
          mkdir -p /pmwork/work/packages
          printf "8\n" > /pmwork/work/version
      - name: Restore pmbootstrap cache
        id: pmbootstrap-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /pmwork/work/cache_distfiles
            /pmwork/work/cache_ccache_x86_64
            /pmwork/work/cache_sccache
          key: pmb-${{ runner.os }}-${{ hashFiles('pmaports/device/testing/device-nothing-tetris/**', 'pmaports/device/testing/firmware-nothing-tetris/**', 'pmaports/device/testing/linux-postmarketos-mediatek-mt6878/**', 'ci/pmbootstrap-aarch64.cfg') }}-${{ github.run_id }}
          restore-keys: |
            pmb-${{ runner.os }}-${{ hashFiles('pmaports/device/testing/device-nothing-tetris/**', 'pmaports/device/testing/firmware-nothing-tetris/**', 'pmaports/device/testing/linux-postmarketos-mediatek-mt6878/**', 'ci/pmbootstrap-aarch64.cfg') }}-
            pmb-${{ runner.os }}-
      - name: Build kernel package
        run: |
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum linux-postmarketos-mediatek-mt6878
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax linux-postmarketos-mediatek-mt6878 --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
      - name: Build device package
        run: |
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum firmware-nothing-tetris
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax firmware-nothing-tetris --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum device-nothing-tetris
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax device-nothing-tetris --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
      - name: Build install images
        run: |
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            install --password 147147 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
          mkdir -p /work/out
          img2simg \
            /pmwork/work/chroot_native/home/pmos/rootfs/nothing-tetris-root.img \
            /work/out/nothing-tetris-root.sparse.img
          cp -v /pmwork/work/chroot_native/home/pmos/rootfs/nothing-tetris-boot.img /work/out/
          cp -v /pmwork/work/chroot_native/mnt/rootfs_nothing-tetris/boot/boot_image.itb /work/out/
          rootfs=/pmwork/work/chroot_native/mnt/rootfs_nothing-tetris
          check_exec() {
            test -x "$rootfs$1" || {
              echo "missing executable in rootfs: $1"
              exit 1
            }
          }
          check_file() {
            test -f "$rootfs$1" || {
              echo "missing file in rootfs: $1"
              exit 1
            }
          }
          check_link() {
            test -L "$rootfs$1" || {
              echo "missing systemd link in rootfs: $1"
              exit 1
            }
          }
          check_contains() {
            description=$1
            needle=$2
            file=$3
            grep -aFq -- "$needle" "$file" || {
              echo "missing $description in $file: $needle"
              exit 1
            }
          }
          check_not_contains() {
            description=$1
            needle=$2
            file=$3
            if grep -aFq -- "$needle" "$file"; then
              echo "unexpected $description in $file: $needle"
              exit 1
            fi
          }
          for executable in \
            /usr/libexec/nothing-tetris-connectivity-setup \
            /usr/libexec/nothing-tetris-audio-policy \
            /usr/libexec/nothing-tetris-bluetooth-address-extract \
            /usr/libexec/nothing-tetris-bluetooth-address \
            /usr/libexec/nothing-tetris-wifi-nvram-extract \
            /usr/libexec/nothing-tetris-wifi-nvram-load \
            /usr/bin/nmcli \
            /usr/bin/bluetoothctl \
            /usr/sbin/wpa_supplicant; do
            check_exec "$executable"
          done
          check_file /usr/lib/systemd/system-preset/89-nothing-tetris.preset
          check_file /usr/lib/systemd/user-preset/89-nothing-tetris-user.preset
          check_file /usr/lib/systemd/user/nothing-tetris-audio-policy.service
          check_file /usr/lib/modules-load.d/nothing-tetris-audio.conf
          check_file /usr/share/mkinitfs/modules/00-device-nothing-tetris.modules
          check_file /usr/lib/firmware/wifi.cfg
          check_file /etc/pulse/default.pa.d/90-nothing-tetris-audio.pa
          check_file /usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/HiFi.conf
          check_file /usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/mt6878-mt6369.conf
          check_file /etc/systemd/system/bluetooth.service.d/10-nothing-tetris-address.conf
          for link in \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-connectivity.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-bluetooth-address-extract.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-bluetooth-address.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-wifi-nvram.service \
            /etc/systemd/system/multi-user.target.wants/NetworkManager.service \
            /etc/systemd/system/dbus-org.bluez.service \
            /etc/systemd/system/bluetooth.target.wants/bluetooth.service; do
            check_link "$link"
          done
          for firmware_size in \
            connsys_bt_mt6878_mt6631.bin:740956 \
            connsys_gnss_mt6878_mt6631.bin:523368 \
            connsys_wifi_mt6878_mt6631.bin:1526820; do
            firmware=${firmware_size%:*}
            expected=${firmware_size#*:}
            actual=$(stat -c %s "$rootfs/usr/lib/firmware/$firmware")
            test "$actual" -eq "$expected" || {
              echo "invalid firmware size: $firmware: $actual != $expected"
              exit 1
            }
          done
          release_dir=$(find "$rootfs/lib/modules" -mindepth 1 -maxdepth 1 \
            -type d -print -quit)
          release=${release_dir##*/}
          test -n "$release"
          rootfs_modinfo() {
            modinfo -b "$rootfs" -k "$release" "$@"
          }
          for module in \
            extra/mediatek-pmic/mtk-spmi-pmic-adc.ko \
            extra/mediatek-pmic/nvmem-mt635x-efuse.ko \
            extra/mediatek-connectivity/connadp.ko \
            extra/mediatek-connectivity/conninfra.ko \
            extra/mediatek-connectivity/connfem.ko \
            extra/mediatek-connectivity/wmtWifi.ko \
            extra/mediatek-connectivity/wlan_drv_gen4m_6878.ko \
            extra/mediatek-connectivity/bt_drv_6878.ko \
            extra/mediatek-connectivity/gps_drv_dl_v051.ko \
            extra/mediatek-audio/mt6685-core.ko \
            extra/mediatek-audio/mt6685-audclk.ko \
            extra/mediatek-audio/snd-soc-mtk-common.ko \
            extra/mediatek-audio/snd-soc-mt6369.ko \
            extra/mediatek-audio/snd-soc-mt6878-afe.ko \
            extra/mediatek-audio/mt6878-mt6369.ko \
            extra/mediatek-sensors/mtk-mbox.ko \
            extra/mediatek-sensors/mtk_rpmsg_mbox.ko \
            extra/mediatek-sensors/mtk_tinysys_ipi.ko \
            extra/mediatek-sensors/scp.ko \
            extra/mediatek-sensors/hf_manager.ko \
            extra/mediatek-sensors/sensorhub.ko; do
            find "$rootfs/lib/modules" -path "*/$module" -print -quit |
              grep -q . || { echo "missing module: $module"; exit 1; }
          done
          if find "$rootfs/lib/modules" -name wmt_drv.ko -print -quit | grep -q .; then
            echo "legacy wmt_drv module must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'ccci*.ko*' \
              -print -quit | grep -q .; then
            echo "compile-only CCCI modules must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'pd9302a.ko*' \
              -print -quit | grep -q .; then
            echo "compile-only pd9302a module must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'tetris-camera-audit.*' \
              -print -quit | grep -q .; then
            echo "compile-only Tetris camera audit must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'panel-samsung-s6e8fc3x02.ko*' \
              -print -quit | grep -q .; then
            echo "compile-only S6E8FC3X02 module must not be packaged"
            exit 1
          fi
          if grep -RIlE \
              '(pd9302a|tetris-camera-audit|panel-samsung-s6e8fc3x02|ccci[_-])' \
              "$rootfs/etc" "$rootfs/usr/lib/modules-load.d" \
              "$rootfs/usr/lib/modprobe.d" "$rootfs/usr/lib/udev/rules.d" \
              "$rootfs/usr/lib/systemd/system" 2>/dev/null | grep -q .; then
            echo "compile-only hardware code has a runtime loader"
            exit 1
          fi
          bt_module=$(find "$rootfs/lib/modules" -name bt_drv_6878.ko -print -quit)
          conninfra_module=$(find "$rootfs/lib/modules" -name conninfra.ko -print -quit)
          wifi_module=$(find "$rootfs/lib/modules" -name wlan_drv_gen4m_6878.ko -print -quit)
          test "$(stat -c %s "$conninfra_module")" -gt 6000000 || {
            echo "conninfra module is missing MT6878 platform objects"
            exit 1
          }
          check_contains "MT6878/MT6631 compatible" \
            'mediatek,mt6878-6631-consys' "$conninfra_module"
          readelf --wide -r "$conninfra_module" > /tmp/conninfra.relocations
          check_contains "MT6878/MT6631 platform-data relocation" \
            'mt6878_6631_plat_data' /tmp/conninfra.relocations
          check_contains "MT6631 26 MHz co-clock fallback" \
            'no MT6685 regmap; using 26M co-clock' "$conninfra_module"
          check_contains "joint pre-calibration power callback" \
            'wlan_precal_pwron_v1' "$wifi_module"
          check_contains "joint pre-calibration calibration callback" \
            'wlan_precal_docal' "$wifi_module"
          check_contains "MT6631 HCI feature mask" \
            'Mask unsupported Synchronization Train feature' "$bt_module"
          check_contains "native HCI registration path" \
            'HCI device registration failed' "$bt_module"
          check_contains "native HCI address programming path" \
            'setting MT6631 public address failed' "$bt_module"
          test "$(rootfs_modinfo -F name gps_drv_dl_v051)" = gps_drv_dl_v051
          test "$(rootfs_modinfo -F depends gps_drv_dl_v051)" = conninfra
          test "$(rootfs_modinfo -F name mt6685_core)" = mt6685_core
          test "$(rootfs_modinfo -F name mt6685_audclk)" = mt6685_audclk
          for sensor_module in \
            mtk_mbox \
            mtk_rpmsg_mbox \
            mtk_tinysys_ipi \
            scp \
            hf_manager \
            sensorhub; do
            test "$(rootfs_modinfo -F name "$sensor_module")" = "$sensor_module"
          done
          # CardId is expanded by ALSA UCM at runtime.
          # shellcheck disable=SC2016
          check_contains "direct two-channel DL6 transport" \
            'PlaybackPCM "hw:${CardId},6"' \
            "$rootfs/usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/HiFi.conf"
          check_contains "mono speaker sink identity" \
            'mono_sink=tetris_mono_speaker' \
            "$rootfs/usr/libexec/nothing-tetris-audio-policy"
          check_contains "deferred mono speaker remap" \
            'pactl load-module module-remap-sink' \
            "$rootfs/usr/libexec/nothing-tetris-audio-policy"
          check_not_contains "eager mono speaker remap" \
            'module-remap-sink' \
            "$rootfs/etc/pulse/default.pa.d/90-nothing-tetris-audio.pa"
          check_contains "speaker lifecycle policy" \
            'pactl subscribe' \
            "$rootfs/usr/libexec/nothing-tetris-audio-policy"
          check_contains "audio policy user preset" \
            'enable nothing-tetris-audio-policy.service' \
            "$rootfs/usr/lib/systemd/user-preset/89-nothing-tetris-user.preset"
          test "$(fdtget "$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris.dtb" \
            /gnss@18c00000 status)" = okay
          test "$(fdtget "$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris.dtb" \
            /soc@0/syscon@13f90000 status)" = disabled
          test "$(fdtget "$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris.dtb" \
            /soc@0/syscon@13f90000/power-controller status)" = disabled
          for radio_module in wlan_drv_gen4m_6878 bt_drv_6878; do
            if rootfs_modinfo -F depends "$radio_module" | tr ',' '\n' | \
                grep -Fxq wmt_drv; then
              echo "legacy wmt_drv dependency in $radio_module"
              exit 1
            fi
          done
          test -e "$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris.dtb"
          if bootargs=$(fdtget \
              "$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris.dtb" \
              /chosen bootargs 2>/dev/null) && \
              printf '%s\n' "$bootargs" | tr ' ' '\n' | \
                grep -Fxq clk_ignore_unused; then
            echo "unexpected clk_ignore_unused in packaged DTB"
            exit 1
          fi
          expected_conninfra_cfg=$(printf 'co_clock_flag=1\npre_cal_mode=0')
          actual_conninfra_cfg=$(cat "$rootfs/usr/lib/firmware/conninfra.cfg")
          test "$actual_conninfra_cfg" = "$expected_conninfra_cfg" || {
            echo "invalid conninfra.cfg"
            printf 'expected:\n%s\nactual:\n%s\n' \
              "$expected_conninfra_cfg" "$actual_conninfra_cfg"
            exit 1
          }
          actual_wifi_cfg=$(grep -Ev '^[[:space:]]*(#|$)' \
            "$rootfs/usr/lib/firmware/wifi.cfg")
          test "$actual_wifi_cfg" = 'DbgLevel0 0xffffffff 0x0f' || {
            echo "invalid production WLAN debug mask: $actual_wifi_cfg"
            exit 1
          }
          test "$(rootfs_modinfo -F name rfcomm)" = rfcomm
          test "$(rootfs_modinfo -F name bnep)" = bnep
          gzip -cd "$rootfs/boot/vmlinuz" > /tmp/nothing-tetris-Image
          check_contains "LLVM 21 compiler identity" \
            'clang version 21' /tmp/nothing-tetris-Image
          gzip -cd "$rootfs/boot/initramfs" > /tmp/nothing-tetris-initramfs.cpio
          check_contains "NCM function in initramfs" \
            'drivers/usb/gadget/function/usb_f_ncm.ko' \
            /tmp/nothing-tetris-initramfs.cpio
          check_contains "NCM deviceinfo selection" \
            'deviceinfo_usb_network_function="ncm.usb0"' \
            /tmp/nothing-tetris-initramfs.cpio
          usb_sleep_hook="$rootfs/usr/lib/systemd/system-sleep/50-nothing-tetris-usb-gadget"
          test -x "$usb_sleep_hook"
          check_contains "USB gadget suspend quiesce" \
            'printf '\''\n'\'' > "$udc_file"' "$usb_sleep_hook"
          check_contains "USB gadget resume restore" \
            'printf '\''%s\n'\'' "$controller" > "$udc_file"' "$usb_sleep_hook"
          rm -f /tmp/nothing-tetris-Image /tmp/nothing-tetris-initramfs.cpio \
            /tmp/conninfra.relocations
          test -s /work/out/nothing-tetris-root.sparse.img
          test -s /work/out/nothing-tetris-boot.img
          test -s /work/out/boot_image.itb
          cat > /work/out/nothing-tetris-radio-live.MANIFEST <<EOF
          github_sha=$GITHUB_SHA
          kernel_release=$release
          pmbootstrap_commit=$PMBOOTSTRAP_COMMIT
          pmaports_commit=$PMAPORTS_COMMIT
          connectivity_source=e96f60dc081ae3525ef43d4bcf0ee5ee97e53835
          device_modules_source=ee2be53cb75670b548948636a0db1d1ff112bf12
          required_uboot_commit=$TETRIS_UBOOT_COMMIT
          required_uboot_sha256=$TETRIS_UBOOT_SHA256
          EOF
          tar -C "$rootfs" -cf /tmp/nothing-tetris-radio-live.tar \
            "lib/modules/$release/extra/mediatek-connectivity" \
            usr/lib/firmware/conninfra.cfg \
            usr/lib/firmware/wifi.cfg \
            usr/lib/firmware/connsys_bt_mt6878_mt6631.bin \
            usr/lib/firmware/connsys_gnss_mt6878_mt6631.bin \
            usr/lib/firmware/connsys_wifi_mt6878_mt6631.bin \
            usr/libexec/nothing-tetris-bluetooth-address-extract \
            usr/libexec/nothing-tetris-bluetooth-address \
            usr/libexec/nothing-tetris-connectivity-setup \
            usr/libexec/nothing-tetris-wifi-nvram-extract \
            usr/libexec/nothing-tetris-wifi-nvram-load \
            usr/lib/systemd/system/nothing-tetris-bluetooth-address-extract.service \
            usr/lib/systemd/system/nothing-tetris-bluetooth-address.service \
            usr/lib/systemd/system/nothing-tetris-connectivity.service \
            usr/lib/systemd/system/nothing-tetris-wifi-nvram.service \
            usr/lib/systemd/system-preset/89-nothing-tetris.preset \
            etc/systemd/system/bluetooth.service.d/10-nothing-tetris-address.conf
          zstd -T0 -10 /tmp/nothing-tetris-radio-live.tar \
            -o /work/out/nothing-tetris-radio-live.tar.zst
          test -s /work/out/nothing-tetris-radio-live.tar.zst
          sha256sum /work/out/nothing-tetris-radio-live.tar.zst >> \
            /work/out/nothing-tetris-radio-live.MANIFEST
          file /work/out/nothing-tetris-root.sparse.img
          (cd /work/out && sha256sum \
            boot_image.itb \
            nothing-tetris-boot.img \
            nothing-tetris-root.sparse.img > SHA256SUMS)
          cat > /work/out/BUILD-MANIFEST <<EOF
          github_sha=$GITHUB_SHA
          pmbootstrap_commit=$PMBOOTSTRAP_COMMIT
          pmaports_commit=$PMAPORTS_COMMIT
          kernel_release=$release
          required_uboot_commit=$TETRIS_UBOOT_COMMIT
          required_uboot_sha256=$TETRIS_UBOOT_SHA256
          EOF
          find /work/out -maxdepth 1 -type f -print
          test -n "$(find /work/out -maxdepth 1 -type f -print -quit)"
      - name: Collect pmbootstrap logs
        if: always()
        run: |
          mkdir -p /work/out/logs
          cp -v /pmwork/work/log.txt /work/out/logs/pmbootstrap.log || true
          find /pmwork/work -name '*.log' -type f -maxdepth 5 -exec cp -v {} /work/out/logs/ \; || true
      - name: Save pmbootstrap cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            /pmwork/work/cache_distfiles
            /pmwork/work/cache_ccache_x86_64
            /pmwork/work/cache_sccache
          key: ${{ steps.pmbootstrap-cache.outputs.cache-primary-key }}
      - name: Upload install images
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nothing-tetris-images
          path: |
            /work/out/boot_image.itb
            /work/out/nothing-tetris-boot.img
            /work/out/nothing-tetris-root.sparse.img
            /work/out/BUILD-MANIFEST
            /work/out/SHA256SUMS
          if-no-files-found: error
      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nothing-tetris-build-logs
          path: /work/out/logs
          if-no-files-found: warn
      - name: Upload radio live bundle
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nothing-tetris-radio-live
          path: |
            /work/out/nothing-tetris-radio-live.tar.zst
            /work/out/nothing-tetris-radio-live.MANIFEST
          if-no-files-found: error
