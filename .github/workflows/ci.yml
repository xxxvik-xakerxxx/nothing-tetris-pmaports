name: CI

on:
  push:
    paths-ignore:
      - 'integrations/sensor-proxy/**'
      - '.github/workflows/sensor-proxy.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run validation and candidate tests without building install images
        type: boolean
        default: false
      kernel_smoke_only:
        description: Compile packaged candidate AArch64 objects without install images
        type: boolean
        default: false
      research_owner_smoke:
        description: Also compile default-off GPU/modem ownership sources, without install images
        type: boolean
        default: false

permissions:
  contents: read

env:
  PMBOOTSTRAP_COMMIT: ea17c1499b7f82d5829849314e89b23684919141
  PMAPORTS_COMMIT: 7ea600ada6d4716b500bda0d6a17ba396be05b5c
  TETRIS_UBOOT_COMMIT: dcb20ce71f5361a4492649d46650d59e9b2cbbc4
  TETRIS_UBOOT_SHA256: 71b474fe0c4cfbdfa33fb9ddef51b835b1bf2c367afc84f5ee4a6d85061a6967
  NOTHING_DEVICE_MODULES_COMMIT: ee2be53cb75670b548948636a0db1d1ff112bf12

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.research_owner_smoke && 'owner-smoke' || inputs.kernel_smoke_only && 'smoke' || inputs.validation_only && 'validation' || 'images' }}
  # Image builds are expensive and may already have verified kernel output.
  # Only cheap validation/smoke/PR runs may replace an earlier matching run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.kernel_smoke_only == true || inputs.validation_only == true || inputs.research_owner_smoke == true }}

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential coreutils findutils git python3 python3-cryptography python3-pyelftools shellcheck
      - name: Shellcheck
        run: shellcheck -S error scripts/*.sh
      - name: Validate pmaports overlay
        run: ./scripts/validate-pmaports-overlay.sh
      - name: Validate isolated kernel object inputs
        run: |
          python3 ci/test-kernel-object-smoke.py
          python3 ci/kernel-object-smoke.py --plan-only
      - name: Verify bounded stock asset selection
        run: python3 ci/test-extract-stock-port-assets.py
      - name: Validate MT6878 display route
        run: sh ./scripts/check-mt6878-display-route.sh
      - name: Validate DRM sequence measurement
        run: python3 ci/test-drm-sequence.py
      - name: Test kernel export evidence collector
        run: python3 scripts/tests/test-kernel-build-evidence.py
      - name: Test integrated modem link gate
        run: python3 scripts/tests/test-modem-link.py
      - name: Test greeter rootfs gate
        run: python3 ci/test-greetd-rootfs.py
      - name: Fetch native display source
        run: |
          mkdir -p upstream/linux
          git -C upstream/linux init
          git -C upstream/linux remote add origin https://github.com/MT6878-mainline/linux.git
          git -C upstream/linux fetch --filter=blob:none --depth=1 origin \
            d84b264a54a37611f2f46bc19363cb9b41606205
          git -C upstream/linux sparse-checkout init --no-cone
          git -C upstream/linux sparse-checkout set --no-cone \
            /arch/arm64/boot/dts/mediatek/ \
            /Documentation/devicetree/bindings/display/mediatek/ \
            /Documentation/devicetree/bindings/power/ \
            /Documentation/devicetree/bindings/regulator/ \
            /MAINTAINERS \
            /drivers/gpu/drm/mediatek/ \
            /drivers/media/i2c/ \
            /drivers/media/platform/mediatek/Kconfig \
            /drivers/media/platform/mediatek/Makefile \
            /drivers/mailbox/mtk-gpueb-mailbox.c \
            /drivers/remoteproc/remoteproc_core.c \
            /drivers/remoteproc/Kconfig \
            /drivers/remoteproc/Makefile \
            /Documentation/devicetree/bindings/mailbox/mediatek,mt8196-gpueb-mbox.yaml \
            /drivers/pmdomain/mediatek/ \
            /drivers/regulator/ \
            /drivers/soc/mediatek/ \
            /include/linux/regulator/mt6315-regulator.h
          git -C upstream/linux checkout --detach FETCH_HEAD
          test "$(git -C upstream/linux rev-parse HEAD)" = \
            d84b264a54a37611f2f46bc19363cb9b41606205
          python3 ci/check-kernel-patch-stack.py --list-paths > /tmp/kernel-stack-paths
          git -C upstream/linux sparse-checkout add --stdin < /tmp/kernel-stack-paths
      - name: Check complete packaged kernel patch stack
        run: python3 ci/check-kernel-patch-stack.py upstream/linux
      - name: Validate native display prereq gates
        run: |
          sh patches/native-display/check-postmask.sh upstream/linux
          sh patches/native-display/check-start-order.sh upstream/linux
          sh patches/native-display/check-topology.sh upstream/linux
      - name: Fetch modem source
        run: |
          mkdir -p upstream/device-modules
          git -C upstream/device-modules init
          git -C upstream/device-modules remote add origin \
            https://github.com/NothingOSS/android_kernel_device_modules_6.1_nothing_mt6878.git
          git -C upstream/device-modules fetch --filter=blob:none --depth=1 origin \
            "$NOTHING_DEVICE_MODULES_COMMIT"
          git -C upstream/device-modules checkout --detach FETCH_HEAD
          test "$(git -C upstream/device-modules rev-parse HEAD)" = \
            "$NOTHING_DEVICE_MODULES_COMMIT"
      - name: Validate modem prereq gates
        run: |
          sh patches/modem/check-candidates.sh upstream/device-modules
          sh patches/modem/check-ccmni.sh upstream/device-modules
          python3 patches/modem/check-smem-mapping.py upstream/device-modules
      - name: Validate staged modem lifecycle callbacks
        run: |
          export TETRIS_VENDOR_TREE="$PWD/upstream/device-modules"
          python3 patches/modem/drafts/runtime-prepare/test_static.py
          python3 patches/modem/drafts/runtime-object-ci/test_static.py
          python3 patches/modem/drafts/runtime-lifecycle/test_static.py
          python3 patches/modem/drafts/runtime-object-ci/check_native_callbacks.py \
            --vendor upstream/device-modules
      - name: Validate isolated modem power sequencing
        run: python3 scripts/check-mt6878-modem-power.py upstream/linux --native-ci
      - name: Validate CCCI first-start backend
        run: python3 patches/modem/check_first_start.py upstream/linux --vendor upstream/device-modules --native-ci
      - name: Validate concrete CCCI transport owner
        id: modem_transport_candidate
        continue-on-error: true
        run: |
          python3 patches/modem/test_transport_owner_fixture.py
          python3 patches/modem/check_transport_owner.py upstream/device-modules --native-ci upstream/linux
      - name: Validate read-only modem preflight
        run: |
          python3 scripts/check-mt6878-modem-preflight.py upstream/linux --native-ci
          TETRIS_KERNEL_TREE=upstream/linux python3 patches/modem/test_preflight_dt.py
      - name: Validate Panthor VGPU readback gate
        run: |
          python3 scripts/check-panthor-vgpu-readback.py \
            upstream/linux \
            upstream/device-modules
      - name: Validate sensor reply gate
        run: python3 scripts/check-sensor-list-reply.py upstream/device-modules
      - name: Validate GPU and camera PMIC phase ownership
        run: python3 scripts/check-mt6315-mode-mask.py upstream/linux
      - name: Validate disabled GPU supply ownership
        run: |
          export TETRIS_KERNEL_TREE=upstream/linux
          python3 patches/gpu/test_supply_inventory.py
          python3 patches/gpu/test_readonly_vgpu.py
          python3 patches/gpu/test_diagnostic_dt.py
          python3 patches/gpu/test_diagnostic_boot.py
          TETRIS_GPU_OBSERVER_TESTS=1 sh patches/gpu/run_native.sh
      - name: Validate GPUEB-owned GPU power backend
        run: |
          export TETRIS_KERNEL_TREE="$PWD/upstream/linux"
          export TETRIS_DEVICE_MODULES_TREE="$PWD/upstream/device-modules"
          sh patches/gpu/run_gpueb_power_ci.sh
      - name: Validate GPUEB session and firmware ingress
        id: gpueb_transport_candidate
        continue-on-error: true
        run: |
          export TETRIS_KERNEL_TREE="$PWD/upstream/linux"
          export TETRIS_DEVICE_MODULES_TREE="$PWD/upstream/device-modules"
          python3 patches/gpu/test_gpueb_firmware.py
          sh patches/gpu/run_gpueb_session_ci.sh
          sh patches/gpu/run_gpueb_owner_boundary_ci.sh
          sh patches/gpu/run_gpueb_fw_staging_ci.sh
          python3 patches/gpu/test_csf_preflight.py
      - name: Validate GPUEB bound-parent power ownership
        run: |
          export TETRIS_DEVICE_MODULES_TREE="$PWD/upstream/device-modules"
          python3 patches/gpu/mfg0-supplier-draft/test_supplier.py
          python3 patches/gpu/bound-parent-draft/test_control.py
          sh patches/gpu/mfg0-supplier-draft/run-native-ci.sh
      - name: Validate sensor startup and sample ABI
        run: |
          python3 scripts/tests/test-sensor-startup.py
          python3 scripts/tests/test-sensor-samples.py
      - name: Validate SCP recovery memory contract
        run: python3 scripts/check-scp-region-host.py upstream/device-modules
      - name: Validate IMX882 reset gate
        run: python3 patches/camera-identity/check-reset.py
      - name: Validate GNSS boot protocol gate
        run: python3 scripts/check-gnss-boot-protocol.py
      - name: Validate GNSS clock readback implementation
        run: |
          git init upstream/connectivity-modules
          git -C upstream/connectivity-modules remote add origin \
            https://github.com/NothingOSS/android_kernel_modules_nothing_mt6878.git
          git -C upstream/connectivity-modules fetch --filter=blob:none --depth=1 origin \
            e96f60dc081ae3525ef43d4bcf0ee5ee97e53835
          python3 scripts/check-gnss-clock-readback.py upstream/connectivity-modules
      - name: Validate IMX882 streaming modes and controls
        run: |
          python3 patches/camera-imx882/check.py \
            --vendor-repo upstream/connectivity-modules --kernel-tree upstream/linux
          sh patches/camera-imx882/run-core-tests.sh
      - name: Validate SENINF resources and graph contracts
        run: |
          python3 patches/camera-seninf/check.py \
            --device-repo upstream/device-modules \
            --modules-repo upstream/connectivity-modules --kernel-tree upstream/linux
          sh patches/camera-seninf/run-contract-tests.sh
          python3 patches/camera-seninf/check-mux.py \
            --device-repo upstream/device-modules \
            --modules-repo upstream/connectivity-modules
          sh patches/camera-seninf/run-mux-tests.sh
          python3 patches/camera-seninf/check-phy.py \
            --device-repo upstream/device-modules \
            --modules-repo upstream/connectivity-modules
          sh patches/camera-seninf/run-phy-tests.sh
          sh patches/camera-seninf-route/run-tests.sh
          python3 patches/camera-seninf-controller/generate-lifecycle.py --check
          python3 patches/camera-native-capture/generate-pm-overlay.py --check
          sh patches/camera-seninf-controller/run-tests.sh
          python3 patches/camera-joint-reset/test-sensor-off.py
          python3 patches/camera-joint-reset/test-cold-joint.py
          python3 patches/camera-repeat-capture/check.py
          python3 patches/camera-repeat-capture/test-completion-order.py
          python3 patches/camera-joint-reset/check.py \
            --modules-repo upstream/connectivity-modules
      - name: Validate CAMSV DMA and composer handoff
        id: camera_transport_candidate
        continue-on-error: true
        run: |
          python3 patches/camera-camsv/check.py \
            --modules-repo upstream/connectivity-modules --device-repo upstream/device-modules
          sh patches/camera-camsv/run-tests.sh
          python3 patches/camera-composer/check.py --modules-repo upstream/connectivity-modules
          sh patches/camera-composer/run-tests.sh
          sh patches/camera-ccd-cq/run-tests.sh
      - name: Validate GNSS host services and second configuration
        id: gnss_host_candidate
        continue-on-error: true
        run: |
          sh patches/gnss-navigation-audit/run_agps_host_ci.sh
          sh patches/gnss-navigation-audit/run_control_notify_ci.sh
          sh patches/gnss-navigation-audit/run_second_config_ci.sh
          sh patches/gnss-navigation-audit/run_navigation_output_ci.sh
          sh patches/gnss-navigation-audit/run_native_receiver_host_ci.sh
          sh patches/gnss-navigation-audit/run_mipc_supervised_child_ci.sh
          sh patches/gnss-navigation-audit/run_native_arguments_ci.sh
          sh patches/gnss-navigation-audit/run_slot6_service_ci.sh
          sh patches/gnss-navigation-audit/run_nv_calibration_ci.sh
          sh patches/gnss-navigation-audit/run_second_numeric_ci.sh
          sh patches/gnss-navigation-audit/run_mipc_calibration_ci.sh
          sh patches/gnss-navigation-audit/run_mipc_checked_tag_ci.sh
      - name: Validate GNSS LNA metadata ownership
        run: |
          export TETRIS_MODULES_TREE="$PWD/upstream/connectivity-modules"
          export TETRIS_DEVICE_MODULES_TREE="$PWD/upstream/device-modules"
          sh patches/gnss-navigation-audit/run_lna_metadata_ci.sh
          sh patches/gnss-navigation-audit/run_lna_control_gate_ci.sh
          sh patches/gnss-navigation-audit/run_lna_query_plan_ci.sh
      - name: Validate GNSS navigation boundary
        run: sh scripts/check-gnss-navigation-boundary.sh
      - name: Validate GNSS host callback and borrowed-output contracts
        run: python3 scripts/check-gnss-host-boundary.py
      - name: Validate typed GNSS startup adapter
        run: |
          sh patches/gnss-navigation-audit/run_startup_adapter_ci.sh
          sh patches/gnss-navigation-audit/run_first_config_ci.sh
      - name: Validate kernel package layout
        run: |
          kernel_apkbuild=pmaports/device/testing/linux-postmarketos-mediatek-mt6878/APKBUILD
          device_apkbuild=pmaports/device/testing/device-nothing-tetris/APKBUILD
          if grep -q '^subpackages=' "$kernel_apkbuild"; then
            echo "kernel package must not split hardware modules into subpackages"
            exit 1
          fi
          if grep -q 'linux-postmarketos-mediatek-mt6878-\(pmic\|connectivity\|audio\)' \
              "$device_apkbuild"; then
            echo "device package must not depend on split kernel hardware packages"
            exit 1
          fi
          if sed -n '/uses: actions\/cache\/\(restore\|save\)@/,/key:/p' \
              .github/workflows/ci.yml | grep -q '/pmwork/work/packages'; then
            echo "package output must not be restored from the Actions cache"
            exit 1
          fi

      - name: Require all transport candidates to pass
        if: ${{ always() && (steps.modem_transport_candidate.outcome == 'failure' || steps.gpueb_transport_candidate.outcome == 'failure' || steps.camera_transport_candidate.outcome == 'failure' || steps.gnss_host_candidate.outcome == 'failure') }}
        run: |
          printf 'CCCI=%s GPUEB=%s camera=%s GNSS=%s\n' \
            '${{ steps.modem_transport_candidate.outcome }}' \
            '${{ steps.gpueb_transport_candidate.outcome }}' \
            '${{ steps.camera_transport_candidate.outcome }}' \
            '${{ steps.gnss_host_candidate.outcome }}'
          exit 1

  build-gnss-bionic-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Obtain matching pinned Android NDK
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -o /tmp/ndk.zip
          test "$(stat -c %s /tmp/ndk.zip)" = 663956036
          printf '%s  %s\n' 22105e410cf29afcf163760cc95522b9fb981121 /tmp/ndk.zip | sha1sum --check
          unzip -q /tmp/ndk.zip -d /tmp
      - name: Build AArch64 Bionic callback tests without vendor engine
        run: |
          mkdir -p out
          ndk=/tmp/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin
          "$ndk/aarch64-linux-android24-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            patches/gnss-navigation-audit/b41_startup_adapter.c \
            patches/gnss-navigation-audit/test_b41_startup_adapter.c \
            -o out/b41-startup-adapter-test
          "$ndk/aarch64-linux-android24-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            patches/gnss-navigation-audit/b41_first_config.c \
            patches/gnss-navigation-audit/test_b41_first_config.c \
            -o out/b41-first-config-test
          "$ndk/aarch64-linux-android28-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            patches/gnss-navigation-audit/b41_nv_calibration.c \
            patches/gnss-navigation-audit/b41_first_config.c \
            patches/gnss-navigation-audit/test_b41_nv_calibration.c \
            -Wl,--wrap=pread -Wl,--wrap=close -o out/b41-nv-calibration-test
          "$ndk/aarch64-linux-android28-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            patches/gnss-navigation-audit/b41_second_numeric.c \
            patches/gnss-navigation-audit/b41_capability_branch.c \
            patches/gnss-navigation-audit/test_b41_second_numeric.c \
            -o out/b41-second-numeric-test
          "$ndk/aarch64-linux-android28-clang" -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            patches/gnss-navigation-audit/b41_mipc_calibration.c \
            patches/gnss-navigation-audit/b41_mipc_checked_tag.c \
            patches/gnss-navigation-audit/test_b41_mipc_calibration.c \
            -o out/b41-mipc-calibration-test
          "$ndk/aarch64-linux-android24-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            patches/gnss-navigation-audit/b41_first_config.c \
            patches/gnss-navigation-audit/b41_first_queries.c \
            patches/gnss-navigation-audit/test_b41_first_queries.c \
            -o out/b41-first-queries-test
          "$ndk/aarch64-linux-android28-clang" -std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -Werror -pthread \
            patches/gnss-navigation-audit/b41_startup_adapter.c \
            patches/gnss-navigation-audit/b41_agps_host.c \
            patches/gnss-navigation-audit/b41_frame_worker.c \
            patches/gnss-navigation-audit/b41_navigation_output.c \
            patches/gnss-navigation-audit/test_b41_navigation_output.c \
            -Wl,--wrap=write -o out/b41-navigation-output-test
          "$ndk/aarch64-linux-android28-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            patches/gnss-navigation-audit/b41_gpsdl_identity.c \
            patches/gnss-navigation-audit/test_b41_gpsdl_identity.c \
            -o out/b41-gpsdl-identity-test
          for fixture in native_receiver_host native_arguments; do
            "$ndk/aarch64-linux-android28-clang" -std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -Werror -pthread \
              patches/gnss-navigation-audit/b41_native_arguments.c \
              patches/gnss-navigation-audit/b41_slot6_service.c \
              patches/gnss-navigation-audit/b41_native_receiver_host.c \
              patches/gnss-navigation-audit/b41_engine_arguments.c \
              patches/gnss-navigation-audit/b41_library_association.c \
              patches/gnss-navigation-audit/b41_gpsdl_identity.c \
              patches/gnss-navigation-audit/b41_startup_adapter.c \
              patches/gnss-navigation-audit/b41_agps_host.c \
              patches/gnss-navigation-audit/b41_frame_worker.c \
              patches/gnss-navigation-audit/b41_navigation_output.c \
              "patches/gnss-navigation-audit/test_b41_${fixture}.c" \
              -o "out/b41-${fixture}-test"
          done
          "$ndk/aarch64-linux-android28-clang" -std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -Werror -pthread \
            patches/gnss-navigation-audit/b41_slot6_service.c \
            patches/gnss-navigation-audit/b41_startup_adapter.c \
            patches/gnss-navigation-audit/b41_agps_host.c \
            patches/gnss-navigation-audit/b41_navigation_output.c \
            patches/gnss-navigation-audit/b41_frame_worker.c \
            patches/gnss-navigation-audit/test_b41_slot6_service.c \
            -o out/b41-slot6-service-test
          "$ndk/aarch64-linux-android28-clang" -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            -c patches/gnss-navigation-audit/b41_mipc_supervised_child.c \
            -o out/b41-mipc-supervised-child.o
          "$ndk/llvm-readelf" -h out/b41-mipc-supervised-child.o | grep 'Machine:.*AArch64'
          "$ndk/aarch64-linux-android28-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            -c patches/gnss-navigation-audit/b41_mipc_loader_root.c \
            -o out/b41-mipc-loader-root.o
          "$ndk/llvm-readelf" -h out/b41-mipc-loader-root.o | grep 'Machine:.*AArch64'
          for binary in out/b41-*-test; do
            "$ndk/llvm-readelf" -h "$binary" | grep 'Machine:.*AArch64'
            "$ndk/llvm-readelf" -d "$binary" > "$binary.DYNAMIC"
            if grep -q 'NEEDED.*libmnl' "$binary.DYNAMIC"; then
              echo 'Standalone tests must not start the vendor navigation engine'
              exit 1
            fi
          done
          printf 'commit=%s\nndk=r27d\nmode=callback-tests-no-vendor-engine\n' \
            "$GITHUB_SHA" > out/BUILD-MANIFEST
          (cd out && sha256sum b41-*-test b41-mipc-supervised-child.o b41-mipc-loader-root.o > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: gnss-bionic-adapter-tests
          path: out/
          if-no-files-found: error

  gnss-sealed-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install native fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential python3 python3-pyelftools
      - name: Validate sealed GNSS loader root
        run: |
          python3 patches/gnss-navigation-audit/test_b41_mipc_probe_resources.py \
            ProbeTests.test_seal_failure_retains_first_with_both_cleanup_faults \
            ProbeTests.test_adapter_retains_frozen_policy_and_deadline
          sh patches/gnss-navigation-audit/run_mipc_loader_resources_ci.sh mounts
      - name: Exercise real sealed launcher and terminal reap
        run: sh patches/gnss-navigation-audit/run_mipc_sealed_launch_ci.sh
      - name: Compile dedicated sealed probe parent and check admission
        run: |
          here=patches/gnss-navigation-audit
          cc -std=c11 -Wall -Wextra -Werror -pthread \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -I"$here" \
            "$here/b41_sealed_probe_parent.c" "$here/b41_mipc_sealed_isolate.c" \
            "$here/b41_mipc_loader_root.c" "$here/b41_mipc_supervised_child.c" \
            "$here/b41_native_receiver_host.c" -o /tmp/b41-sealed-probe-parent
          python3 "$here/test_b41_sealed_probe_cli.py"
          python3 "$here/test_b41_sealed_probe_ci.py"
          python3 ci/test-gnss-delegated-load.py

  kernel-object-smoke:
    needs: validate-overlay
    if: ${{ inputs.research_owner_smoke || inputs.kernel_smoke_only || (github.event_name != 'pull_request' && !inputs.validation_only) }}
    runs-on: ubuntu-latest
    container:
      # Official Alpine 3.23.3 linux/amd64; avoid shared Docker Hub pull limits.
      image: public.ecr.aws/docker/library/alpine:3.23.3@sha256:59855d3dceb3ae53991193bd03301e082b2a7faa56a514b03527ae0ec2ce3a95
    steps:
      - uses: actions/checkout@v6
      - name: Install package-matching kernel compiler
        run: |
          apk add --no-cache bash build-base bc bison flex clang21 llvm21 lld21 \
            openssl-dev perl python3 patch linux-headers git
      - name: Compile isolated AArch64 candidate objects
        run: |
          export PATH="/usr/lib/llvm21/bin:$PATH"
          if [ '${{ inputs.research_owner_smoke }}' = true ]; then
            python3 ci/kernel-object-smoke.py --research-owners
            python3 patches/modem/drafts/runtime-object-ci/check_objects.py
          else
            python3 ci/kernel-object-smoke.py
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-object-smoke-evidence
          path: out/kernel-object-smoke/
          if-no-files-found: warn

  build-pmaports:
    needs: [validate-overlay, kernel-object-smoke, gnss-sealed-loader, build-gnss-bionic-adapter]
    if: ${{ github.event_name != 'pull_request' && !inputs.validation_only && !inputs.kernel_smoke_only && !inputs.research_owner_smoke }}
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/docker/library/alpine:3.23.3@sha256:59855d3dceb3ae53991193bd03301e082b2a7faa56a514b03527ae0ec2ce3a95
      options: --privileged --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - name: Prepare /work checkout
        run: |
          mkdir -p /work
          cp -a "$GITHUB_WORKSPACE"/. /work/
      - name: Install build tools
        run: |
          apk add --no-cache \
            android-tools \
            build-base bzip2 ccache coreutils cryptsetup dosfstools e2fsprogs-extra \
            dtc file findutils git kmod linux-headers mtools multipath-tools openssl \
            openssl-dev parted patch py3-yaml python3 rsync sfdisk sudo tar \
            u-boot-tools util-linux xz zstd
      - name: Fetch upstream pmaports and pmbootstrap
        run: |
          cd /work
          mkdir -p upstream/pmbootstrap upstream/pmaports
          git -C upstream/pmbootstrap init
          git -C upstream/pmbootstrap remote add origin \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          git -C upstream/pmbootstrap fetch --depth=1 origin "$PMBOOTSTRAP_COMMIT"
          git -C upstream/pmbootstrap checkout --detach FETCH_HEAD
          test "$(git -C upstream/pmbootstrap rev-parse HEAD)" = "$PMBOOTSTRAP_COMMIT"
          git -C upstream/pmaports init
          git -C upstream/pmaports remote add origin \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C upstream/pmaports fetch --depth=1 origin "$PMAPORTS_COMMIT"
          git -C upstream/pmaports checkout --detach FETCH_HEAD
          test "$(git -C upstream/pmaports rev-parse HEAD)" = "$PMAPORTS_COMMIT"
          git -C upstream/pmaports update-ref \
            refs/remotes/origin/main "$PMAPORTS_COMMIT"
          ./scripts/apply-pmaports-patches.sh upstream/pmaports
          rm -rf \
            upstream/pmaports/device/testing/device-nothing-tetris \
            upstream/pmaports/device/testing/firmware-nothing-tetris \
            upstream/pmaports/device/testing/linux-postmarketos-mediatek-mt6878
          rsync -a \
            pmaports/device/testing/device-nothing-tetris/ \
            upstream/pmaports/device/testing/device-nothing-tetris/
          rsync -a \
            pmaports/device/testing/firmware-nothing-tetris/ \
            upstream/pmaports/device/testing/firmware-nothing-tetris/
          rsync -a \
            pmaports/device/testing/linux-postmarketos-mediatek-mt6878/ \
            upstream/pmaports/device/testing/linux-postmarketos-mediatek-mt6878/
      - name: Prepare pmbootstrap workdir
        run: |
          mkdir -p /pmwork/work/cache_distfiles
          mkdir -p /pmwork/work/cache_ccache_x86_64
          mkdir -p /pmwork/work/cache_sccache
          mkdir -p /pmwork/work/packages
          printf "8\n" > /pmwork/work/version
      - name: Restore pmbootstrap cache
        id: pmbootstrap-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /pmwork/work/cache_distfiles
            /pmwork/work/cache_ccache_x86_64
            /pmwork/work/cache_sccache
          key: pmb-${{ runner.os }}-${{ hashFiles('pmaports-patches/**', 'pmaports/device/testing/device-nothing-tetris/**', 'pmaports/device/testing/firmware-nothing-tetris/**', 'pmaports/device/testing/linux-postmarketos-mediatek-mt6878/**', 'ci/pmbootstrap-aarch64.cfg') }}-${{ github.run_id }}
          restore-keys: |
            pmb-${{ runner.os }}-${{ hashFiles('pmaports-patches/**', 'pmaports/device/testing/device-nothing-tetris/**', 'pmaports/device/testing/firmware-nothing-tetris/**', 'pmaports/device/testing/linux-postmarketos-mediatek-mt6878/**', 'ci/pmbootstrap-aarch64.cfg') }}-
            pmb-${{ runner.os }}-
      - name: Build kernel package
        run: |
          # Set package-local cleanup policy after abuild's global defaults.
          # pmbootstrap's global abuild.conf edit did not retain this build.
          printf '\n' >> /work/upstream/pmaports/device/testing/linux-postmarketos-mediatek-mt6878/APKBUILD
          cat /work/ci/retain-kernel-evidence.abuild >> \
            /work/upstream/pmaports/device/testing/linux-postmarketos-mediatek-mt6878/APKBUILD
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum linux-postmarketos-mediatek-mt6878
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax linux-postmarketos-mediatek-mt6878 --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
      - name: Preserve configured kernel exports and DTB
        run: |
          python3 /work/scripts/collect-kernel-build-evidence.py \
            /pmwork/work /work/out/kernel-build-evidence --commit "$GITHUB_SHA" --modem --diagnostics
      - name: Upload configured kernel evidence
        uses: actions/upload-artifact@v7
        with:
          name: nothing-tetris-kernel-build-evidence
          path: /work/out/kernel-build-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Build device package
        run: |
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum postmarketos-initramfs
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax postmarketos-initramfs --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum firmware-nothing-tetris
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax firmware-nothing-tetris --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            checksum device-nothing-tetris
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax device-nothing-tetris --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
      - name: Build sensor desktop backend package
        run: |
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            build --force --lax iio-sensor-proxy-tetris --arch aarch64 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
      - name: Build install images
        id: install_images
        run: |
          cd /work/upstream/pmbootstrap
          ./pmbootstrap.py --as-root \
            --work /pmwork/work \
            -c /work/ci/pmbootstrap-aarch64.cfg \
            install --password 147147 ||
            { tail -n 300 /pmwork/work/log.txt || true; exit 1; }
          mkdir -p /work/out
          img2simg \
            /pmwork/work/chroot_native/home/pmos/rootfs/nothing-tetris-root.img \
            /work/out/nothing-tetris-root.sparse.img
          cp -v /pmwork/work/chroot_native/home/pmos/rootfs/nothing-tetris-boot.img /work/out/
          cp -v /pmwork/work/chroot_native/mnt/rootfs_nothing-tetris/boot/boot_image.itb /work/out/
          rootfs=/pmwork/work/chroot_native/mnt/rootfs_nothing-tetris
          check_exec() {
            test -x "$rootfs$1" || {
              echo "missing executable in rootfs: $1"
              exit 1
            }
          }
          check_file() {
            test -f "$rootfs$1" || {
              echo "missing file in rootfs: $1"
              exit 1
            }
          }
          check_link() {
            test -L "$rootfs$1" || {
              echo "missing systemd link in rootfs: $1"
              exit 1
            }
          }
          check_contains() {
            description=$1
            needle=$2
            file=$3
            grep -aFq -- "$needle" "$file" || {
              echo "missing $description in $file: $needle"
              exit 1
            }
          }
          check_not_contains() {
            description=$1
            needle=$2
            file=$3
            if grep -aFq -- "$needle" "$file"; then
              echo "unexpected $description in $file: $needle"
              exit 1
            fi
          }
          for executable in \
            /usr/libexec/nothing-tetris-connectivity-setup \
            /usr/libexec/nothing-tetris-gnss-readonly \
            /usr/libexec/nothing-tetris-audio-policy \
            /usr/libexec/nothing-tetris-display-unblank \
            /usr/libexec/nothing-tetris-bluetooth-address-extract \
            /usr/libexec/nothing-tetris-bluetooth-address \
            /usr/libexec/nothing-tetris-wifi-nvram-extract \
            /usr/libexec/nothing-tetris-wifi-nvram-load \
            /usr/bin/nmcli \
            /usr/bin/bluetoothctl \
            /usr/sbin/wpa_supplicant; do
            check_exec "$executable"
          done
          check_file /usr/lib/systemd/system-preset/89-nothing-tetris.preset
          check_file /usr/lib/systemd/user-preset/89-nothing-tetris-user.preset
          check_file /usr/lib/systemd/system/nothing-tetris-display-unblank.service
          check_file /usr/lib/systemd/user/nothing-tetris-audio-policy.service
          check_file /usr/lib/modules-load.d/nothing-tetris-audio.conf
          check_file /usr/share/mkinitfs/modules/00-device-nothing-tetris.modules
          check_exec /usr/libexec/nothing-tetris-sensor-proxy
          check_exec /usr/libexec/nothing-tetris-sensors
          check_file /usr/lib/systemd/system/iio-sensor-proxy.service.d/90-tetris-hf.conf
          check_file /usr/share/dbus-1/system-services/net.hadess.SensorProxy.service
          check_file /usr/lib/udev/rules.d/80-tetris-hf.rules
          check_file /usr/lib/firmware/wifi.cfg
          check_file /etc/pulse/default.pa.d/90-nothing-tetris-audio.pa
          check_file /usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/HiFi.conf
          check_file /usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/mt6878-mt6369.conf
          check_file /etc/systemd/system/bluetooth.service.d/10-nothing-tetris-address.conf
          for link in \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-connectivity.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-bluetooth-address-extract.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-bluetooth-address.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-display-unblank.service \
            /etc/systemd/system/multi-user.target.wants/nothing-tetris-wifi-nvram.service \
            /etc/systemd/system/multi-user.target.wants/NetworkManager.service \
            /etc/systemd/system/dbus-org.bluez.service \
            /etc/systemd/system/bluetooth.target.wants/bluetooth.service; do
            check_link "$link"
          done
          for firmware_size in \
            connsys_bt_mt6878_mt6631.bin:740956 \
            connsys_gnss_mt6878_mt6631.bin:523368 \
            connsys_wifi_mt6878_mt6631.bin:1526820; do
            firmware=${firmware_size%:*}
            expected=${firmware_size#*:}
            actual=$(stat -c %s "$rootfs/usr/lib/firmware/$firmware")
            test "$actual" -eq "$expected" || {
              echo "invalid firmware size: $firmware: $actual != $expected"
              exit 1
            }
          done
          release_dir=$(find "$rootfs/lib/modules" -mindepth 1 -maxdepth 1 \
            -type d -print -quit)
          release=${release_dir##*/}
          test -n "$release"
          rootfs_modinfo() {
            modinfo -b "$rootfs" -k "$release" "$@"
          }
          for module in \
            extra/mediatek-pmic/mtk-spmi-pmic-adc.ko \
            extra/mediatek-pmic/nvmem-mt635x-efuse.ko \
            extra/mediatek-connectivity/connadp.ko \
            extra/mediatek-connectivity/conninfra.ko \
            extra/mediatek-connectivity/connfem.ko \
            extra/mediatek-connectivity/wmtWifi.ko \
            extra/mediatek-connectivity/wlan_drv_gen4m_6878.ko \
            extra/mediatek-connectivity/bt_drv_6878.ko \
            extra/mediatek-connectivity/gps_drv_dl_v051.ko \
            extra/mediatek-audio/mt6685-core.ko \
            extra/mediatek-audio/mt6685-audclk.ko \
            extra/mediatek-audio/snd-soc-mtk-common.ko \
            extra/mediatek-audio/snd-soc-mt6369.ko \
            extra/mediatek-audio/snd-soc-mt6878-afe.ko \
            extra/mediatek-audio/mt6878-mt6369.ko \
            extra/mediatek-sensors/mtk-mbox.ko \
            extra/mediatek-sensors/mtk_rpmsg_mbox.ko \
            extra/mediatek-sensors/mtk_tinysys_ipi.ko \
            extra/mediatek-sensors/scp.ko \
            extra/mediatek-sensors/hf_manager.ko \
            extra/mediatek-sensors/sensorhub.ko; do
            find "$rootfs/lib/modules" -path "*/$module" -print -quit |
              grep -q . || { echo "missing module: $module"; exit 1; }
          done
          if find "$rootfs/lib/modules" -name wmt_drv.ko -print -quit | grep -q .; then
            echo "legacy wmt_drv module must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" \
              \( -name 'ccci*.ko*' -o -name '*dpmaif*.ko*' \) \
              -print -quit | grep -q .; then
            echo "compile-only CCCI/DPMAIF modules must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'pd9302a.ko*' \
              -print -quit | grep -q .; then
            echo "compile-only pd9302a module must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'clk-mt6878-cam.ko*' \
              -print -quit | grep -q .; then
            echo "compile-only MT6878 camera clock module must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'tetris-camera-audit.*' \
              -print -quit | grep -q .; then
            echo "compile-only Tetris camera audit must not be packaged"
            exit 1
          fi
          if find "$rootfs/lib/modules" -name 'panel-samsung-s6e8fc3x02.ko*' \
              -print -quit | grep -q .; then
            echo "built-in S6E8FC3X02 driver must not be packaged as a module"
            exit 1
          fi
          if find "$rootfs" \( -name 'mt6375-bc12-decode.*' \
              -o -name 'mt6375-bc12-lifecycle.*' \) \
              -print -quit | grep -q .; then
            echo "compile-only MT6375 BC1.2 object must not be packaged"
            exit 1
          fi
          panthor_module=$(find "$rootfs/lib/modules" -name panthor.ko -print -quit)
          test -n "$panthor_module" || {
            echo "missing compile-only Panthor module"
            exit 1
          }
          test "$(rootfs_modinfo -F name panthor)" = panthor
          test "$(rootfs_modinfo -F name gpueb-flat-analysis)" = gpueb_flat_analysis
          test "$(rootfs_modinfo -F vermagic gpueb-flat-analysis | cut -d ' ' -f 1)" = "$release"
          rootfs_modinfo -F alias gpueb-flat-analysis |
            grep -Fq 'Cnothing,tetris-gpueb-flat-analysis-v1'
          if grep -RIlE \
              '(panthor|pd9302a|clk-mt6878-cam|tetris-camera-audit|ccci[_-]|dpmaif|mt6375-bc12-(decode|lifecycle))' \
              "$rootfs/etc" "$rootfs/usr/lib/modules-load.d" \
              "$rootfs/usr/lib/modprobe.d" "$rootfs/usr/lib/udev/rules.d" \
              "$rootfs/usr/lib/systemd/system" 2>/dev/null | grep -q .; then
            echo "compile-only hardware code has a runtime loader"
            exit 1
          fi
          bt_module=$(find "$rootfs/lib/modules" -name bt_drv_6878.ko -print -quit)
          conninfra_module=$(find "$rootfs/lib/modules" -name conninfra.ko -print -quit)
          wifi_module=$(find "$rootfs/lib/modules" -name wlan_drv_gen4m_6878.ko -print -quit)
          test "$(stat -c %s "$conninfra_module")" -gt 6000000 || {
            echo "conninfra module is missing MT6878 platform objects"
            exit 1
          }
          check_contains "MT6878/MT6631 compatible" \
            'mediatek,mt6878-6631-consys' "$conninfra_module"
          readelf --wide -r "$conninfra_module" > /tmp/conninfra.relocations
          check_contains "MT6878/MT6631 platform-data relocation" \
            'mt6878_6631_plat_data' /tmp/conninfra.relocations
          check_contains "MT6631 26 MHz co-clock fallback" \
            'no MT6685 regmap; using 26M co-clock' "$conninfra_module"
          check_contains "joint pre-calibration power callback" \
            'wlan_precal_pwron_v1' "$wifi_module"
          check_contains "joint pre-calibration calibration callback" \
            'wlan_precal_docal' "$wifi_module"
          check_contains "MT6631 HCI feature mask" \
            'Mask unsupported Synchronization Train feature' "$bt_module"
          check_contains "native HCI registration path" \
            'HCI device registration failed' "$bt_module"
          check_contains "native HCI address programming path" \
            'setting MT6631 public address failed' "$bt_module"
          test "$(rootfs_modinfo -F name gps_drv_dl_v051)" = gps_drv_dl_v051
          test "$(rootfs_modinfo -F depends gps_drv_dl_v051)" = conninfra
          test "$(rootfs_modinfo -F name mt6685_core)" = mt6685_core
          test "$(rootfs_modinfo -F name mt6685_audclk)" = mt6685_audclk
          for sensor_module in \
            mtk_mbox \
            mtk_rpmsg_mbox \
            mtk_tinysys_ipi \
            scp \
            hf_manager \
            sensorhub; do
            test "$(rootfs_modinfo -F name "$sensor_module")" = "$sensor_module"
          done
          # CardId is expanded by ALSA UCM at runtime.
          # shellcheck disable=SC2016
          check_contains "direct two-channel DL6 transport" \
            'PlaybackPCM "hw:${CardId},6"' \
            "$rootfs/usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/HiFi.conf"
          check_contains "mono speaker sink identity" \
            'mono_sink=tetris_mono_speaker' \
            "$rootfs/usr/libexec/nothing-tetris-audio-policy"
          check_contains "audio policy greeter exclusion" \
            'ConditionUser=!greetd' \
            "$rootfs/usr/lib/systemd/user/nothing-tetris-audio-policy.service"
          check_contains "audio policy session target" \
            'WantedBy=graphical-session.target' \
            "$rootfs/usr/lib/systemd/user/nothing-tetris-audio-policy.service"
          check_contains "deferred mono speaker remap" \
            'pactl load-module module-remap-sink' \
            "$rootfs/usr/libexec/nothing-tetris-audio-policy"
          check_not_contains "eager mono speaker remap" \
            'module-remap-sink' \
            "$rootfs/etc/pulse/default.pa.d/90-nothing-tetris-audio.pa"
          check_contains "speaker lifecycle policy" \
            'pactl subscribe' \
            "$rootfs/usr/libexec/nothing-tetris-audio-policy"
          check_contains "audio policy user preset" \
            'enable nothing-tetris-audio-policy.service' \
            "$rootfs/usr/lib/systemd/user-preset/89-nothing-tetris-user.preset"
          check_contains "greeter display policy user preset" \
            'enable nothing-tetris-greeter-display-policy.service' \
            "$rootfs/usr/lib/systemd/user-preset/89-nothing-tetris-user.preset"
          check_contains "greeter display policy exec" \
            'sleep-inactive-battery-type nothing' \
            "$rootfs/usr/libexec/nothing-tetris-greeter-display-policy"
          check_contains "greeter display policy unit" \
            'ExecStart=/usr/libexec/nothing-tetris-greeter-display-policy' \
            "$rootfs/usr/lib/systemd/user/nothing-tetris-greeter-display-policy.service"
          check_contains "display unblank system preset" \
            'enable nothing-tetris-display-unblank.service' \
            "$rootfs/usr/lib/systemd/system-preset/89-nothing-tetris.preset"
          check_contains "display unblank exec" \
            'printf 0 > "$fb_blank"' \
            "$rootfs/usr/libexec/nothing-tetris-display-unblank"
          check_contains "display unblank unit" \
            'ExecStart=/usr/libexec/nothing-tetris-display-unblank' \
            "$rootfs/usr/lib/systemd/system/nothing-tetris-display-unblank.service"
          check_contains "greeter PulseAudio autostart disabled" \
            'Hidden=true' \
            "$rootfs/var/lib/greetd/.config/autostart/pulseaudio.desktop"
          check_contains "greeter PulseAudio client autospawn disabled" \
            'autospawn = no' \
            "$rootfs/var/lib/greetd/.config/pulse/client.conf"
          check_contains "greeter dconf directory" \
            'd /var/lib/greetd/.config/dconf 0700 greetd greetd -' \
            "$rootfs/usr/lib/tmpfiles.d/nothing-tetris-greetd.conf"
          python3 /work/ci/check-greetd-rootfs.py "$rootfs"
          sh /work/pmaports/device/testing/device-nothing-tetris/validate-audio-ucm \
            "$rootfs/usr/share/alsa/ucm2/MediaTek/mt6878-mt6369/HiFi.conf"
          native_dtb="$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris-native.dtb"
          test -e "$native_dtb"
          if fdtget -l "$native_dtb" /chosen | grep -Fxq simplefb@fe0d0000; then
            echo "native display DTB still contains simplefb"
            exit 1
          fi
          test "$(fdtget "$native_dtb" \
            /gnss@18c00000 status)" = okay
          test "$(fdtget "$native_dtb" \
            /soc@0/syscon@13f90000 status)" = disabled
          test "$(fdtget "$native_dtb" \
            /soc@0/syscon@13f90000/power-controller status)" = disabled
          if fdtget -l "$native_dtb" /soc@0 | \
              grep -Eq '^(gpu|mali)@13000000$'; then
            echo "compile-only Panthor boundary gained a runtime GPU node"
            exit 1
          fi
          test "$(fdtget "$native_dtb" \
            /soc@0/i2c@11e03000/camera@1a status)" = disabled
          for camera_supply in afvdd avdd dvdd dovdd; do
            test "$(fdtget \
              "$native_dtb" \
              "/regulator-camera-main-$camera_supply" status)" = disabled
          done
          if fdtget "$native_dtb" \
              /soc@0/i2c@11e03000 clock-frequency >/dev/null 2>&1; then
            echo "disabled camera fixture changed shared I2C8 frequency"
            exit 1
          fi
          for radio_module in wlan_drv_gen4m_6878 bt_drv_6878; do
            if rootfs_modinfo -F depends "$radio_module" | tr ',' '\n' | \
                grep -Fxq wmt_drv; then
              echo "legacy wmt_drv dependency in $radio_module"
              exit 1
            fi
          done
          if bootargs=$(fdtget \
              "$native_dtb" \
              /chosen bootargs 2>/dev/null) && \
              printf '%s\n' "$bootargs" | tr ' ' '\n' | \
                grep -Fxq clk_ignore_unused; then
            echo "unexpected clk_ignore_unused in packaged DTB"
            exit 1
          fi
          expected_conninfra_cfg=$(printf 'co_clock_flag=1\npre_cal_mode=0')
          actual_conninfra_cfg=$(cat "$rootfs/usr/lib/firmware/conninfra.cfg")
          test "$actual_conninfra_cfg" = "$expected_conninfra_cfg" || {
            echo "invalid conninfra.cfg"
            printf 'expected:\n%s\nactual:\n%s\n' \
              "$expected_conninfra_cfg" "$actual_conninfra_cfg"
            exit 1
          }
          actual_wifi_cfg=$(grep -Ev '^[[:space:]]*(#|$)' \
            "$rootfs/usr/lib/firmware/wifi.cfg")
          test "$actual_wifi_cfg" = 'DbgLevel0 0xffffffff 0x0f' || {
            echo "invalid production WLAN debug mask: $actual_wifi_cfg"
            exit 1
          }
          test "$(rootfs_modinfo -F name rfcomm)" = rfcomm
          test "$(rootfs_modinfo -F name bnep)" = bnep
          gzip -cd "$rootfs/boot/vmlinuz" > /tmp/nothing-tetris-Image
          check_contains "LLVM 21 compiler identity" \
            'clang version 21' /tmp/nothing-tetris-Image
          gzip -cd "$rootfs/boot/initramfs" > /tmp/nothing-tetris-initramfs.cpio
          check_contains "NCM function in initramfs" \
            'drivers/usb/gadget/function/usb_f_ncm.ko' \
            /tmp/nothing-tetris-initramfs.cpio
          check_contains "NCM deviceinfo selection" \
            'deviceinfo_usb_network_function="ncm.usb0"' \
            /tmp/nothing-tetris-initramfs.cpio
          usb_sleep_hook="$rootfs/usr/lib/systemd/system-sleep/50-nothing-tetris-usb-gadget"
          test -x "$usb_sleep_hook"
          check_contains "USB gadget suspend quiesce" \
            'printf '\''\n'\'' > "$udc_file"' "$usb_sleep_hook"
          check_contains "USB gadget resume restore" \
            'printf '\''%s\n'\'' "$controller" > "$udc_file"' "$usb_sleep_hook"
          rm -f /tmp/nothing-tetris-Image /tmp/nothing-tetris-initramfs.cpio \
            /tmp/conninfra.relocations
          test -s /work/out/nothing-tetris-root.sparse.img
          test -s /work/out/nothing-tetris-boot.img
          test -s /work/out/boot_image.itb
          cat > /work/out/nothing-tetris-radio-live.MANIFEST <<EOF
          github_sha=$GITHUB_SHA
          kernel_release=$release
          pmbootstrap_commit=$PMBOOTSTRAP_COMMIT
          pmaports_commit=$PMAPORTS_COMMIT
          connectivity_source=e96f60dc081ae3525ef43d4bcf0ee5ee97e53835
          device_modules_source=ee2be53cb75670b548948636a0db1d1ff112bf12
          required_uboot_commit=$TETRIS_UBOOT_COMMIT
          required_uboot_sha256=$TETRIS_UBOOT_SHA256
          EOF
          tar -C "$rootfs" -cf /tmp/nothing-tetris-radio-live.tar \
            "lib/modules/$release/extra/mediatek-connectivity" \
            usr/lib/firmware/conninfra.cfg \
            usr/lib/firmware/wifi.cfg \
            usr/lib/firmware/connsys_bt_mt6878_mt6631.bin \
            usr/lib/firmware/connsys_gnss_mt6878_mt6631.bin \
            usr/lib/firmware/connsys_wifi_mt6878_mt6631.bin \
            usr/libexec/nothing-tetris-bluetooth-address-extract \
            usr/libexec/nothing-tetris-bluetooth-address \
            usr/libexec/nothing-tetris-connectivity-setup \
            usr/libexec/nothing-tetris-wifi-nvram-extract \
            usr/libexec/nothing-tetris-wifi-nvram-load \
            usr/lib/systemd/system/nothing-tetris-bluetooth-address-extract.service \
            usr/lib/systemd/system/nothing-tetris-bluetooth-address.service \
            usr/lib/systemd/system/nothing-tetris-connectivity.service \
            usr/lib/systemd/system/nothing-tetris-wifi-nvram.service \
            usr/lib/systemd/system-preset/89-nothing-tetris.preset \
            etc/systemd/system/bluetooth.service.d/10-nothing-tetris-address.conf
          zstd -T0 -10 /tmp/nothing-tetris-radio-live.tar \
            -o /work/out/nothing-tetris-radio-live.tar.zst
          test -s /work/out/nothing-tetris-radio-live.tar.zst
          sha256sum /work/out/nothing-tetris-radio-live.tar.zst >> \
            /work/out/nothing-tetris-radio-live.MANIFEST
          file /work/out/nothing-tetris-root.sparse.img
          (cd /work/out && sha256sum \
            boot_image.itb \
            nothing-tetris-boot.img \
            nothing-tetris-root.sparse.img > SHA256SUMS)
          cat > /work/out/BUILD-MANIFEST <<EOF
          github_sha=$GITHUB_SHA
          pmbootstrap_commit=$PMBOOTSTRAP_COMMIT
          pmaports_commit=$PMAPORTS_COMMIT
          kernel_release=$release
          required_uboot_commit=$TETRIS_UBOOT_COMMIT
          required_uboot_sha256=$TETRIS_UBOOT_SHA256
          EOF
          find /work/out -maxdepth 1 -type f -print
          test -n "$(find /work/out -maxdepth 1 -type f -print -quit)"
      - name: Build isolated read-only diagnostic boot artifacts
        run: |
          rootfs=/pmwork/work/chroot_native/mnt/rootfs_nothing-tetris
          native="$rootfs/boot/dtbs/mediatek/mt6878-nothing-tetris-native.dtb"
          diagnostics="$rootfs/usr/share/nothing-tetris/diagnostic-dtbs"
          builder=/work/patches/gpu/build_diagnostic_boot.py
          its=/work/pmaports/device/testing/device-nothing-tetris/boot_image.its
          python3 "$builder" --mode vgpu-observe \
            --normal-fit /work/out/boot_image.itb \
            --boot-image /work/out/nothing-tetris-boot.img \
            --normal-dtb "$native" \
            --diagnostic-dtb "$diagnostics/mt6878-nothing-tetris-vgpu-observe.dtb" \
            --its "$its" --require-boot-image \
            --output-dir /work/out/readonly-diagnostics/vgpu-observe
          python3 "$builder" --mode modem-preflight \
            --normal-fit /work/out/boot_image.itb \
            --boot-image /work/out/nothing-tetris-boot.img \
            --normal-dtb "$native" \
            --baseline-dtb "$diagnostics/mt6878-nothing-tetris-modem-preflight-off.dtb" \
            --diagnostic-dtb "$diagnostics/mt6878-nothing-tetris-modem-preflight.dtb" \
            --its "$its" --require-boot-image \
            --output-dir /work/out/readonly-diagnostics/modem-preflight
          cp /work/out/BUILD-MANIFEST /work/out/readonly-diagnostics/BUILD-MANIFEST
          cd /work/out
          sha256sum --check SHA256SUMS
      - name: Upload isolated read-only diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: nothing-tetris-readonly-diagnostics
          path: /work/out/readonly-diagnostics/
          if-no-files-found: error
      - name: Collect pmbootstrap logs
        if: always()
        run: |
          mkdir -p /work/out/logs
          cp -v /pmwork/work/log.txt /work/out/logs/pmbootstrap.log || true
          find /pmwork/work -name '*.log' -type f -maxdepth 5 -exec cp -v {} /work/out/logs/ \; || true
      - name: Save pmbootstrap cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            /pmwork/work/cache_distfiles
            /pmwork/work/cache_ccache_x86_64
            /pmwork/work/cache_sccache
          key: ${{ steps.pmbootstrap-cache.outputs.cache-primary-key }}
      - name: Upload install images
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.install_images.outcome == 'success' }}
        with:
          name: nothing-tetris-images
          path: |
            /work/out/boot_image.itb
            /work/out/nothing-tetris-boot.img
            /work/out/nothing-tetris-root.sparse.img
            /work/out/BUILD-MANIFEST
            /work/out/SHA256SUMS
          if-no-files-found: error
      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nothing-tetris-build-logs
          path: /work/out/logs
          if-no-files-found: warn
      - name: Upload radio live bundle
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nothing-tetris-radio-live
          path: |
            /work/out/nothing-tetris-radio-live.tar.zst
            /work/out/nothing-tetris-radio-live.MANIFEST
          if-no-files-found: error
