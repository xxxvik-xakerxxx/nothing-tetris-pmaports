name: Modem metadata producer and driver

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: modem-metadata-candidate
  cancel-in-progress: false

jobs:
  producer-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang python3 p7zip-full
      - name: Fetch exact vendor and bootloader producers
        run: |
          git init out/vendor
          git -C out/vendor fetch --depth=1 https://github.com/NothingOSS/android_kernel_device_modules_6.1_nothing_mt6878.git ee2be53cb75670b548948636a0db1d1ff112bf12
          git init out/uboot
          git -C out/uboot fetch --depth=1 https://github.com/MT6878-Mainline/u-boot.git 60cd9ade5b999732304f3b755c7dbe3d34307c13
          git init out/smem-uboot
          git -C out/smem-uboot fetch --depth=1 https://github.com/xxxvik-xakerxxx/u-boot.git \
            cdd806438d73e2e163fcc9aded557b029816011e \
            e2929baa549f54ce5518b2dd84952318ba857fda
          git -C out/smem-uboot checkout --detach e2929baa549f54ce5518b2dd84952318ba857fda
          test "$(git -C out/smem-uboot rev-parse HEAD)" = e2929baa549f54ce5518b2dd84952318ba857fda
          git fetch --no-tags --depth=1 origin 190ea155e1a8343dbdb4f0992f06b92848c9cdac
      - name: Extract only public modem firmware
        run: python3 ci/extract-stock-modem.py
      - name: Execute producer to actual import fixtures
        run: |
          python3 -B patches/modem/drafts/runtime-link-closure/test_link.py
          python3 ci/test-modem-metadata-native.py
          python3 ci/modem-metadata-native.py --vendor out/vendor --uboot out/uboot
      - name: Execute unattached SMEM transaction fixtures
        id: smem
        env:
          CC: clang
        run: |
          set -euo pipefail
          mkdir out/modem-smem-native
          sha256sum patches/modem/drafts/runtime-smem/REVIEW.sha256 \
            > out/modem-smem-native/REVIEW-SHA256SUMS
          python3 patches/modem/drafts/runtime-smem/check_smem.py \
            --vendor out/vendor --uboot out/uboot --native-ci \
            --stock-container out/stock-modem/md1img.bin \
            2>&1 | tee out/modem-smem-native/native.log
      - name: Record actual SMEM fixture outcome
        if: always()
        run: |
          mkdir -p out/modem-smem-native
          printf '%s\n' \
            '{"commit":"${{ github.sha }}","step_outcome":"${{ steps.smem.outcome }}","mode":"native-asan-ubsan","physical_map_executed":false,"hardware_readiness":false}' \
            > out/modem-smem-native/RESULT.json
      - name: Execute actual packaged import to SMEM plan
        env:
          CC: clang
        run: |
          set -euo pipefail
          python3 patches/modem/drafts/runtime-metadata/check_packaged_smem.py \
            --vendor out/vendor --uboot out/uboot \
            --stock-container out/stock-modem/md1img.bin \
            2>&1 | tee out/modem-smem-native/packaged-plan.log
          python3 patches/modem/drafts/runtime-smem-consumer/run_native_ci.py \
            --vendor out/vendor \
            2>&1 | tee out/modem-smem-native/private-consumer.log
          python3 -B patches/modem/drafts/runtime-hif-resources/run_native_ci.py \
            --vendor out/vendor --report out/modem-smem-native/hif-resources.json \
            2>&1 | tee out/modem-smem-native/hif-resources.log
      - name: Execute real SMEM boot-evidence producer and decoder
        env:
          CC: clang
        run: |
          set -euo pipefail
          python3 -B patches/modem/drafts/smem-boot-evidence/check.py \
            --uboot out/smem-uboot --native-ci \
            2>&1 | tee out/modem-smem-native/boot-evidence.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: modem-metadata-native-evidence
          path: |
            out/modem-metadata-native/
            out/modem-smem-native/
            out/stock-modem/BUILD-MANIFEST.json
          if-no-files-found: error

  driver-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: public.ecr.aws/docker/library/alpine:3.23.3@sha256:59855d3dceb3ae53991193bd03301e082b2a7faa56a514b03527ae0ec2ce3a95
    steps:
      - name: Install package-matching kernel compiler
        run: |
          apk add --no-cache bash build-base bc bison flex \
            openssl-dev perl python3 py3-yaml patch linux-headers git dtc curl kmod
          apk add --no-cache \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            clang21=21.1.8-r3 llvm21=21.1.8-r1 lld21=21.1.8-r1
      - uses: actions/checkout@v6
      - name: Fetch exact bootloader planner
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init out/uboot
          git -C out/uboot fetch --depth=1 https://github.com/MT6878-Mainline/u-boot.git 60cd9ade5b999732304f3b755c7dbe3d34307c13
          git fetch --no-tags --depth=1 origin 190ea155e1a8343dbdb4f0992f06b92848c9cdac
          git fetch --no-tags --depth=1 origin e0c67c561ff7c1a0472da851edfafd5a0abb6cec
          git init out/infra-vendor
          git -C out/infra-vendor fetch --depth=1 https://github.com/NothingOSS/android_kernel_device_modules_6.1_nothing_mt6878.git ee2be53cb75670b548948636a0db1d1ff112bf12
      - name: Compile actual isolated ARM64 driver stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/usr/lib/llvm21/bin:$PATH"
          python3 ci/kernel-object-smoke.py --research-owners
          python3 -B patches/modem/infra-clocks/check.py \
            --vendor out/infra-vendor \
            --linux-archive /tmp/tetris-kernel-smoke/linux-postmarketos-mediatek-mt6878-d84b264a54a37611f2f46bc19363cb9b41606205.tar.gz
          python3 patches/modem/drafts/runtime-object-ci/check_objects.py \
            --metadata --smem --uboot out/uboot
          python3 ci/packaged-smem-objects.py --link-r181 --gpueb-analysis --smem-consumer
      - name: Link complete private CCCI stack against real r181 exports
        run: |
          export PATH="/usr/lib/llvm21/bin:$PATH"
          python3 -B patches/modem/drafts/runtime-link-closure/link_full.py \
            --vendor /tmp/tetris-kernel-smoke/vendor-git-source \
            --destination /tmp/tetris-ccci-full-link
      - name: Link resource-only CCCI profile without transport activation
        run: |
          export PATH="/usr/lib/llvm21/bin:$PATH"
          python3 -B patches/modem/drafts/runtime-link-closure/link_full.py \
            --vendor /tmp/tetris-kernel-smoke/vendor-git-source \
            --hif-resources --destination /tmp/tetris-ccci-resource-link
      - name: Preserve complete CCCI link outcome
        if: always()
        run: |
          mkdir -p out/kernel-object-smoke/full-ccci-link
          for name in full-link.json backend-link.log full-link.log artifacts; do
            if test -e "/tmp/tetris-ccci-full-link/$name"; then
              cp -R "/tmp/tetris-ccci-full-link/$name" out/kernel-object-smoke/full-ccci-link/
            fi
          done
          mkdir -p out/kernel-object-smoke/resource-ccci-link
          for name in full-link.json backend-link.log full-link.log artifacts; do
            if test -e "/tmp/tetris-ccci-resource-link/$name"; then
              cp -R "/tmp/tetris-ccci-resource-link/$name" out/kernel-object-smoke/resource-ccci-link/
            fi
          done
      - name: Link native infrastructure clocks against genuine handset ABI
        run: |
          export PATH="/usr/lib/llvm21/bin:$PATH"
          python3 -B patches/modem/infra-clocks/run_ci.py
      - name: Link actual native camera genpd provider with shared VMM ownership
        run: |
          export PATH="/usr/lib/llvm21/bin:$PATH"
          python3 -B ci/link-native-camera-vmm.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: modem-metadata-arm64-evidence
          path: out/kernel-object-smoke/
          if-no-files-found: error

  hif-dt-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install DT and immutable FIT packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 curl device-tree-compiler u-boot-tools e2fsprogs clang lld llvm make gcc flex bison bc libssl-dev
      - name: Compile the exact packaged native and HIF DTs only
        run: python3 -B ci/kernel-object-smoke.py --dt-only --work /tmp/tetris-hif-dt-kernel
      - name: Repackage only the checked HIF DT into original r182 boot inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/build-hif-dt-image.py \
            --dtbs out/kernel-object-smoke/dtbs --output out/hif-r182-boot
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nothing-tetris-r182-hif-dt-boot
          path: out/hif-r182-boot/
          if-no-files-found: error
